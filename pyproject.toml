[project]
name = "draftpool"
version = "1.0.1"
description = "Local iterative image generation: Ollama prompt enrichment against a pool of Draw Things drafts, culled to keepers and finalized/upscaled."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "pillow>=10.4",
    "numpy>=2.5.2",
    "opencv-python-headless>=4.10,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
