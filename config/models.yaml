  # ---------------------------------------------------------------------------
  # The entry below was added the cheap way, and its comments say which numbers
  # that leaves standing on evidence and which are still a prior.
  #
  # It is Illustrious/SDXL by Draw Things' own custom.json -- version
  # sdxl_base_v0.9, modifier none, sdxl_vae_v1.0, both CLIP companions -- i.e.
  # byte-for-byte the same machine as the three entries above. That is what
  # licenses inheriting the GEOMETRY (final, upscale, prompt_budget,
  # clip_skip, and the absences) instead of re-establishing it: those are
  # architecture facts, and the entries above already label the same values as
  # convention rather than measurement.
  #
  # It does NOT license inheriting `sampler` or `cfg`. Those are the two fields
  # MODEL-MEASUREMENTS.md records as having been copied from a neighbour and
  # been wrong on both merges, so they were rendered:
  # scripts/add_model.py --level confirm, 13 renders and 12.8 minutes of Draw
  # Things against ~50 for a full batch, because the artefact shows at draft
  # resolution. Frames and results.json in research/confirm/janku/. It was
  # worth spending: the family prior predicted the wrong sampler here.
  #
  # A second checkpoint of the same architecture, rinFlanimeIllustrious v5.0,
  # was added the same way; it is `rinflanime` below, where the inherited
  # final size did not hold.
  # ---------------------------------------------------------------------------

  janku:
    label: "JANKU Illustrious v7.77"
    # JANKU Trained + Chenkin & NoobAI + RouWei Illustrious XL v7.77.
    # Illustrious/SDXL: architecture signature identical to
    # cyberrealistic-illustrious and oneobsession above (sdxl_base_v0.9,
    # modifier none, sdxl_vae_v1.0_f16, dual CLIP), checked rather than assumed
    # -- scripts/add_model.py --like refuses when it does not match.
    dt_filename: "jankutrainedchenkinnoobai_v777_f16.ckpt"
    # JANKU Trained + Chenkin & NoobAI + RouWei Illustrious XL v7.77,
    # civitai.com/models/1277670. Matched by filename: this version ships
    # JANKUTrainedChenkinNoobai_v777.safetensors, and no other version or
    # variant page of this author's ships that name. Only used when publishing,
    # to attribute the checkpoint on the post; a converted .ckpt cannot be
    # matched by hash. Update it with the weights.
    civitai_version_id: 2786084
    # MEASURED, and it is the first entry in this file to ship Euler a on an
    # SDXL checkpoint. Frames in research/confirm/janku/; the model card names
    # "Euler / Euler A" at 25-30 steps, cfg 3-5, and the card is right here.
    #
    # This was expected to move to DPM++ 2M Karras and did not, which is the
    # finding. Euler a against DPM++ 2M Karras, cfg 5.0 and 3.5, seeds
    # 1111/2222, 768px, read on 1:1 centre crops: **all eight cells are
    # clean**. No rainbow speckle on skin, hair edges or the armour under
    # either sampler, and every face has a formed mouth -- none of the artefact
    # the two Illustrious merges above show at their family's settings.
    #
    # The diagnostic that makes this a verdict rather than a glance is the
    # step-direction cell: leftover ancestral noise gets WORSE with more steps.
    # Euler a at 45 steps is no worse than at 30 (it is if anything crisper),
    # so there is no unresolved injection to find. Raising the count on the two
    # merges above made their speckle visibly worse at 30 than at 20.
    #
    # So the four-out-of-four DPM++ 2M Karras prior across this file's SDXL
    # entries predicted the wrong answer for this checkpoint, exactly as
    # MODEL-MEASUREMENTS.md warns it might: a sampler that is wrong for one
    # model says nothing about the others. DPM++ 2M Karras is also clean here
    # and costs the same (36s against 37s at 768/30), so this is not a
    # performance choice -- the card names Euler a, it is clean, and there is
    # no evidence to overrule it with.
    sampler: "Euler a"
    # MEASURED at 5.0, which is the card author's own stated go-to and the top
    # of the card's 3-5 range. No CFG burn at 5.0 on either sampler or seed,
    # so the reason the two merges above had to come down to 4.0 does not
    # apply here.
    #
    # 3.5 is also clean, and is not chosen because of prompt adherence: the
    # scene asks for "loose black hair" and the DPM++ cfg3.5 seed-2222 cell
    # rendered it silver. That is ONE cell of four and so a hint rather than a
    # finding -- one seed hands you false positives, which this file has been
    # caught by before -- but it points the same way as wai-illustrious above,
    # which is measurably softer and drops prompt detail at 4.0 against 6.0.
    # With no burn to trade against, there is nothing to buy by going lower.
    cfg: 5.0
    uses_negative_prompt: true
    prompt_style: tags
    # Inert on this endpoint -- sending it changes nothing, measured on
    # cyberrealistic-illustrious above -- and kept only so the entry states the
    # NoobAI/Illustrious convention.
    clip_skip: 2
    # No quality_prefix/negative_prefix: the card says to use "your normal
    # NoobAI/Illustrious quality triggers", which is exactly the shared
    # DEFAULT_TAG_PREFIX and DEFAULT_TAG_NEGATIVE in app/schemas.py. Its own
    # Lazy Embeddings are a separate download and are not installed here.
    prompt_guidance: |
      Describe the picture in prose -- ordinary sentences, using Danbooru's
      exact wording wherever it has a word for what you mean (1girl, twin
      braids, from above, looking at viewer) and plain English wherever it does
      not. Cover subject count first, then character and series when the
      subject is a known character, appearance, clothing, expression and pose,
      scene, lighting, composition, style. Say which subject has which feature
      and where each thing is in sentences. No artist names.
    # Inherited, and unmeasured on this checkpoint: the conservative default,
    # which is what every Illustrious entry here ships and labels as such
    # (docs/decisions/PROMPT-LENGTH.md). It under-promises -- if this model is
    # roomier, the cost is a shorter prompt than it could take, never a broken
    # render -- and closing it properly is 10 renders.
    prompt_budget: { full: 240, fading: 600 }
    # 1024: the SDXL buckets, reasoning on wai-illustrious above. Measured:
    # every ratio, seeds 1111/2222, 12 of 12 single-figure (research/aspect/).
    # Finalize only; a Faithful takes the final's 1536, and this checkpoint
    # showed why on a smaller face than cyberrealistic-illustrious did: ~60px,
    # rough eyes at 1280x832, formed at 1856x1280, and the txt2img control at
    # 1280x832 as rough as the Faithful -- pixels on the face, not the draft
    # (DRAFT-STEPS.md, "Shaped Faithfuls").
    aspect_size: 1024
    #
    # 768: SDXL at 512 is a quarter of its native area and drafts to mush that
    # no step count fixes, which is an architecture fact rather than a
    # checkpoint one and is why this is inherited rather than re-rendered.
    #
    # 14 steps is the weakest number in this entry. DRAFT-STEPS.md has four of
    # five checkpoints on this sampler disagreeing about exactly this value,
    # and it is judged on the Faithful taken from the draft rather than on the
    # draft itself, so scripts/sweep_draft_size.py is what settles it. 14 is
    # the middle of what the three siblings landed on (10/14/14).
    draft: { size: 768, steps: 14, cfg: 5.0, sampler: "Euler a" }
    # 1536 CHECKED for the one thing that cannot be inherited: seeds 1111 and
    # 2222 at 1536 are a single subject each, no duplication, no second head or
    # horizon (whole frames, research/confirm/janku/sheet_final_size.png). The
    # card independently states the model is stable at 1536x1536 with no
    # upscaling and recommends 1024x1536.
    #
    # 20 steps is INHERITED, not measured. The card says 25-30; the three
    # siblings all came to 20-24 once each was looked at separately, and
    # FINAL-STEPS.md found nothing above ~24 buys anything on this
    # architecture. Worth a sweep if this model looks short on detail, but
    # that file's reading was that what is missing at 20 is missing at 40 too.
    final: { size: 1536, steps: 20, strength: 0.5 }
    # No tiled_diffusion and no max_upscale_size: the SDXL models here reach
    # 2048 unaided, which is true of the architecture rather than the weights.
    upscale: { size: 2048, steps: 20, strength: 0.3 }

  rinflanime:
    label: "RIN Flanime Illustrious v5.0"
    # Illustrious/SDXL, architecture signature checked identical to janku above
    # and to the two merges before it (sdxl_base_v0.9, modifier none,
    # sdxl_vae_v1.0_f16, dual CLIP) -- scripts/add_model.py --like refuses when
    # it does not match, so this is verified rather than assumed.
    dt_filename: "rinflanimeillustrious_v50_f16.ckpt"
    # RIN Flanime Illustrious - High-Quality Flat Anime v5.0,
    # civitai.com/models/1544647. Matched by filename: this version ships
    # rinFlanimeIllustrious_v50.safetensors.
    #
    # This entry shipped blank at first on the finding that no such page
    # existed, which was WRONG -- a creator listing from the Civitai API is not
    # an enumeration and had silently omitted it (MODEL-MEASUREMENTS.md).
    # Still do NOT credit civitai.com/models/1929865 "RIN Flanime Noob": same
    # author, shares a stem, and is a v-prediction NoobAI checkpoint rather
    # than this Illustrious one.
    civitai_version_id: 3262295
    # MEASURED, frames in research/confirm/rinflanime/. Euler a against
    # DPM++ 2M Karras at cfg 5.0 and 3.5, seeds 1111/2222, 768px/30 steps, read
    # on 1:1 crops: all eight cells clean, no speckle on skin, hair edges or
    # metal under either sampler. Euler a at 45 steps is no worse than at 30,
    # so there is no unresolved ancestral injection either. The card names
    # "Euler, Euler a, DPM++ 2M, DPM++ 2M Karras" and the first of them holds.
    #
    # Second SDXL entry here to ship Euler a, after janku. The four-of-four
    # DPM++ 2M Karras prior that predated janku has now failed twice, which is
    # enough to stop treating it as a prior at all for this family.
    sampler: "Euler a"
    # MEASURED at 5.0, the middle of the card's stated 3-7. No CFG burn at 5.0
    # on either sampler or seed. 3.5 is clean too and, unlike janku, showed no
    # prompt-adherence drift -- so there is nothing to choose between them on
    # artefacts, and 5.0 is kept for the sharper line art this checkpoint is
    # for.
    cfg: 5.0
    uses_negative_prompt: true
    prompt_style: tags
    # The card asks for clip skip 2 explicitly. Inert on this endpoint either
    # way (measured on cyberrealistic-illustrious above); kept because the card
    # states it.
    clip_skip: 2
    # No quality_prefix/negative_prefix. The card's own positive opener is
    # "masterpiece, best quality" and its negative is "lowres, bad quality,
    # worst quality, worst detail, username, signature" -- both subsets of the
    # shared DEFAULT_TAG_PREFIX and DEFAULT_TAG_NEGATIVE in app/schemas.py, so
    # the defaults already say everything the card asks for and more.
    prompt_guidance: |
      Describe the picture in prose -- ordinary sentences, using Danbooru's
      exact wording wherever it has a word for what you mean (1girl, twin
      braids, from above, looking at viewer) and plain English wherever it does
      not. Cover subject count first, then character and series when the
      subject is a known character, appearance, clothing, expression and pose,
      scene, lighting, composition, style. Say which subject has which feature
      and where each thing is in sentences. This checkpoint is a flat-anime
      finetune built for clean line art and vibrant flat colour: include the
      tag "flat color" when that look is wanted, and prefer plain colour and
      lighting words over photographic or rendering vocabulary. No artist
      names.
    # Inherited and unmeasured on this checkpoint: the conservative default,
    # as on every Illustrious entry here (docs/decisions/PROMPT-LENGTH.md).
    prompt_budget: { full: 240, fading: 600 }
    # 1024: the SDXL buckets, reasoning on wai-illustrious above. Measured:
    # every ratio, seeds 1111/2222, 12 of 12 single-figure (research/aspect/).
    # Here it is also the final's own size, and the
    # final's cap is about area (1536 duplicates at 24 steps, below) -- which
    # every shape at this budget stays under, its 1344 long edge included.
    aspect_size: 1024
    #
    # 768 draft, inherited: 512 is a quarter of SDXL's native area and drafts
    # to mush no step count fixes, which is architecture rather than weights.
    # 14 steps is the weakest number in this entry, inherited from the sibling
    # and settled properly only by scripts/sweep_draft_size.py.
    draft: { size: 768, steps: 14, cfg: 5.0, sampler: "Euler a" }
    # 1024, NOT the 1536 the three Illustrious siblings ship, and the reason is
    # a measured interaction between size and step count rather than a size
    # limit. Whole frames, research/confirm/rinflanime/:
    #
    #            20 steps      24 steps
    #   1024     clean 3/3     clean 2/2
    #   1280     clean 3/3     --
    #   1536     clean 3/3     DUPLICATED 3/3
    #
    # At 1536 and 24 steps every seed puts a SECOND FIGURE behind the subject
    # from a prompt naming one person. At the same size and 20 steps no seed
    # does. 3/3 against 0/3 at matched size and seeds is not seed noise, and
    # both readings that fitted fewer frames were wrong: "1536 duplicates" (it
    # does not at 20) and "the 24-step pair was unlucky" (it reproduces 3/3).
    #
    # So 1536/20 is clean and is still not shipped, because it sits four steps
    # from a reproducible failure and **final.steps is user-overridable from
    # the gear in the header** (see the note at the top of this file). A
    # configuration that breaks when someone raises a step count is not one to
    # hand out. 1024 is clean at both counts, is the card's own primary square
    # (its largest listed size is 1024x1360, and unlike janku's card it never
    # claims 1536), and reaches 2048 through Upscale like everything else here.
    final: { size: 1024, steps: 20, strength: 0.5 }
    # A Faithful is the exception to the 1024, MEASURED: it is img2img at 0.5
    # over a draft that already holds the figure, and the duplication above is
    # a txt2img composing one. Nine 1536-budget Faithfuls on this model (the
    # reporting session's own cowboy-shot queen: two seeds at 3:2 and 3:4, then
    # one seed on the other five shapes, square included) were one figure
    # each, and the face is formed at 1856x1280 where the 1280x832 Faithful's
    # is a smeared eye under a blurred crown -- at 3:2 the difference between
    # the report "faces are of bad quality" and not. 113s against 47s.
    # research/draft-size/rinflanime/, DRAFT-STEPS.md "A Faithful size of its
    # own". Unmeasured: a Faithful with final.steps raised in the gear (48
    # asked, 24 real at 1536), which is the txt2img failure's step count.
    faithful_size: 1536
    # No tiled_diffusion and no max_upscale_size: the SDXL models here reach
    # 2048 unaided. Steps inherited from the sibling rather than halved.
    upscale: { size: 2048, steps: 20, strength: 0.3 }

  perfectdeliberate:
    label: "PerfectDeliberate v5.0a (artistic)"
    # 1024, under the 1280 final: the SDXL buckets, reasoning on
    # wai-illustrious above. Measured: every ratio, seeds 1111/2222, 12 of 12
    # single-figure (research/aspect/).
    aspect_size: 1024
    # SDXL (it carries the dual CLIP companions), so SDXL conventions. Note
    # that Draw Things drops the dot in a version: v50a is v5.0a, and the older
    # v1.0 would be v10 -- a different model as far as match_filename is
    # concerned, which only ever matches quantisation variants of one version.
    dt_filename: "perfectdeliberate_v50a_f16.ckpt"
    # PerfectDeliberate-Anime v5.0_A, civitai.com/models/111274.
    # Matched by filename: this version ships perfectdeliberate_v50A.safetensors.
    # NOT civitai.com/models/24350, which is the plain PerfectDeliberate line by
    # the same author and ships perfectdeliberate_v50.safetensors -- one letter
    # apart, a different model page. The A is "Anime". Check the variant pages
    # before trusting a near-match.
    # Only used when publishing, to attribute the checkpoint on the post;
    # a converted .ckpt cannot be matched by hash. Update it with the weights.
    civitai_version_id: 2925672
    sampler: "DPM++ 2M Karras"
    cfg: 6.0
    uses_negative_prompt: true
    prompt_style: prose
    prompt_guidance: |
      Write one flowing prose paragraph. Order: subject and appearance, action,
      environment, lighting, mood, medium and style. Front-load the most
      important content in the first sentence. Never use negative phrasing. No
      tag lists, no weighting syntax.
    # Measured, and it decays harder than wai-illustrious: at 860 characters
    # one seed lost the end-of-prompt marker entirely and the other rendered it
    # as a yellow umbrella instead of a balloon. Clear at 592.
    prompt_budget: { full: 240, fading: 600 }
    # Sizes measured, square, seeds 1111/2222/3333/4242 per SHAPES.md. Single
    # subject at 1024 and 1280 on all four seeds; at 1536 one seed came back
    # with two women, and it costs 272s against 114s, so the final stays at
    # 1280. (detect_faces was useless here -- it reported up to 8 faces in a
    # hedge. Scored by eye.)
    # Draft is 1024, and it is the ONLY model here that needs it. Below 768
    # this model changes STYLE, rendering flat illustration at 384 and 512
    # where the final is photoreal, so a cheaper draft misrepresents the final
    # -- the one thing a draft has to get right. 256 is formless.
    #
    # 768 was the shipped value and it loses ENTITIES, which the style finding
    # above never reached. On the night-market scene (a vendor, and "a cat
    # sitting under the table") the draft fuses the two on three of four seeds:
    # a full cat's head at 1111, a cat-eared hood with no face at 3333, cat
    # ears at 4242. 1024 is correct on all four. It is inherited rather than
    # fixed later -- img2img at strength 0.5 preserves composition, so the
    # cat-headed vendor is still there in the Faithful.
    #
    # NOT because "SDXL needs 1024": the same scene in TAG wording, on this
    # same prose checkpoint at 768, is clean on all four seeds, and the three
    # tag-dialect SDXL checkpoints here show nothing at 768 on either scene.
    # What breaks is prose naming a second creature in a subordinate clause at
    # 768 -- which is exactly what Enrich writes for a prose model, so it is a
    # live failure and not a lab one. Deleting the clause is not the fix: the
    # scene then comes back with no vendor at all, at both sizes.
    #
    # Costs 19.4s -> 34.2s. The Faithful is unchanged at 114s either way (it
    # renders at 1280 whatever it was initialised from), so the whole price is
    # ~10% of a picture. Frames: research/draft-size/perfectdeliberate/,
    # write-up in docs/decisions/DRAFT-STEPS.md.
    #
    # DMD2 at 768/12 steps saved 27s -> 20s; not worth the extra moving part.
    # 14 steps, not 20: 25.4s -> 19.1s, accepted on the Faithful
    # (docs/decisions/DRAFT-STEPS.md): brightness 190.4/192.1 from the 14-step
    # draft against 191.9/194.3 from the 20-step one, inside noise.
    #
    # NOT 10, which fails on the draft alone -- the hair takes a blue cast and
    # the colour oversaturates at both portrait seeds, the same failure
    # wai-illustrious shows and oneobsession does not. Three of the four
    # DPM++ 2M Karras checkpoints here stop at 14 and only oneobsession
    # reaches 10, on identical sampler, step count and stage size.
    #
    # The step count was measured AT 768 and is carried over unmeasured; a
    # 1024 frame is 1.8x the work per step, so if anything wants re-measuring
    # here next it is whether 14 is still the floor at this size.
    draft: { size: 1024, steps: 14, cfg: 6.0, sampler: "DPM++ 2M Karras" }
    # 30 steps, i.e. left where it shipped -- but checked rather than inherited.
    # Swept at 20 / 30 / 45, two scenes, 1280px
    # (docs/decisions/FINAL-STEPS.md; frames in research/final-steps/).
    #
    # It was briefly set to 20, which looks sufficient, and moved back on a
    # closer look: some minor detail is better at 30. Second verdict on this
    # sweep to be revised upward that way, after juggernaut-ragnarok -- on both,
    # the low rung passed a first pass and failed a look at small detail
    # specifically. 45 is not taken.
    final: { size: 1280, steps: 30, strength: 0.5 }
    upscale: { size: 2048, steps: 20, strength: 0.3 }

  juggernaut-ragnarok:
    label: "Juggernaut XL Ragnarok"
    # Equal to the final size below, so nothing is given up. Measured directly
    # at 1344x768: single lighthouse, one horizon, exact size, 101s; and the
    # standard scene there at seed 1111, 5 steps, one figure
    # (research/aspect/juggernaut-ragnarok).
    aspect_size: 1024
    dt_filename: "juggernaut_xl_ragnarok_f16.ckpt"
    # Juggernaut XL Ragnarok, civitai.com/models/133005.
    # Matched by filename: this version ships juggernautXL_ragnarok.safetensors.
    # Only used when publishing, to attribute the checkpoint on the post;
    # a converted .ckpt cannot be matched by hash. Update it with the weights.
    civitai_version_id: 1759168
    # creator-recommended: DPM++ 2M Karras, cfg 4-6, 30+ steps
    sampler: "DPM++ 2M Karras"
    cfg: 5.0
    uses_negative_prompt: true
    prompt_style: prose
    # This entry used to carry "STRICT LIMIT: 40 words" on the grounds that a
    # CLIP encoder "ignores everything past ~75 tokens". Measured, it does not:
    # a marker sentence at the end of an 860-character prompt rendered at full
    # size, because Draw Things chunks the prompt into 75-token windows and
    # encodes all of them. The limit was costing this model three quarters of
    # its usable prompt for nothing. Length now comes from prompt_budget above;
    # what is left here is the ordering advice, which still holds.
    prompt_guidance: |
      Subject and appearance first, then setting, then lighting, then
      photographic language (camera body, lens and aperture, film stock,
      e.g. "85mm f/1.8, Portra 400"). Comma-separated keyword phrases are
      preferred over full sentences.
    # Measured, and the roomiest here -- which was the surprise. Its dual CLIP
    # encoder has the SHORTEST context of anything shipped, yet the marker
    # rendered at full size at every length up to 860 characters: Draw Things
    # chunks a long prompt into 75-token windows and encodes all of them, so
    # the tail is not dropped. `fading` is where the measurement stopped, not a
    # cliff anybody found.
    prompt_budget: { full: 600, fading: 900 }
    # The bare checkpoint at 14 steps -- the rung three of the four SDXL
    # checkpoints in DRAFT-STEPS.md settled on, and 14 and 20 are the same
    # picture here too (frames in research/draft-size/juggernaut-ragnarok,
    # seed 1111, both scenes; Faithful brightness 64.1 / 64.1 and 87.9 / 87.1).
    # 18.5s a draft against 25s at 20.
    #
    # This used to be a DMD2 draft: the 4-step LoRA at weight 0.6, 12 steps,
    # cfg 3.5, Euler a, kept on the draft after DMD2 was rejected on every
    # SDXL final (it replaces the checkpoint's look with a high-contrast
    # ink-outline poster; docs/decisions/FINAL-STEPS.md) on the reasoning that
    # a draft is judged on composition, where the look does not matter. That
    # reasoning was wrong about what a draft is for. A Faithful is img2img at
    # 0.5 over the draft, and the DMD2 cast rides straight through it: the
    # plain 32-real-step Faithful over a DMD2 draft is the teal-and-red poster
    # at 1024, while the Faithful over a plain draft of the same seed is the
    # photograph the checkpoint draws on its own. Exactly what the Illustrious
    # DMD2 trial saw ("warms the Faithful over it"). And the LoRA saved
    # nothing: the DMD2 draft took 20.3s, this one 18.5s.
    # research/draft-size/juggernaut_plain.py rendered the plain arm.
    draft: { size: 768, steps: 14 }
    # 32 steps, i.e. left where it shipped -- but now looked at rather than
    # inherited. Swept at 20 / 32 / 48, two scenes
    # (docs/decisions/FINAL-STEPS.md; frames in research/final-steps/).
    #
    # Two separate things are true here and it took a reversal to keep them
    # apart. This checkpoint is not good at some anatomic detail, and that is
    # wrong at 48 exactly as at 20 -- its own limitation, not a thin schedule,
    # so no step count buys it back. AND minor detail elsewhere in the frame is
    # better at 32 than at 20. The first fact does not license the low rung:
    # "the defect is constant" is not "nothing improves", and the second
    # question has to be asked separately.
    #
    # 48 is not taken: nothing was seen that 32 does not already have.
    final: { size: 1024, steps: 32, strength: 0.5 }
    # 2048 measured clean and quick (82s, corr 0.99 against the source): SDXL
    # has none of the 2.4MP trouble the Cosmos and Krea models hit, so this
    # needs no diffusion tiling. That also caps it at 2048: 3K and 4K are
    # offered only where tiled_diffusion is on, and enabling it here is
    # untested (see the note below).
    upscale: { size: 2048, steps: 24, strength: 0.35 }
    # deliberately not tiled_diffusion: it renders 2048 unaided, and the one
    # run that combined the two took Draw Things down (on a session that was
    # already short of RAM, so the flag is not proven guilty -- but there is
    # nothing to gain by finding out)
    upscale_seconds: 84

  # ideogram-4 (Ideogram 4) was REMOVED, not hidden. It rendered text inside a
  # picture better than anything else here -- asked for a shop sign reading
  # "OPEN TODAY" over "poetry upstairs" it was the only model that got both
  # lines right -- but it runs its output through a safety filter that blocks
  # renders unpredictably, and a blocked render is not an error: a valid
  # 1024px PNG at HTTP 200, a grey card captioned "Image blocked by safety
  # filter", delivered after the full render time was paid. At about a quarter
  # of an hour per render, that is an expensive way to be told nothing, and
  # nothing in the app detects it: the grey card is stored as a successful
  # generation and lands in the grid looking like a finished draft.
  #
  # The filter false-positives freely and cannot be prompted around: it
  # blocked "A girl in a red coat stands on a gravel path in a park" and the
  # same sentence with "A woman", while passing a woman on a stone pier.
  # z-image-turbo rendered every blocked prompt without complaint, so the
  # filter is Ideogram's, not Draw Things'.
  #
  # The measurements and the full block/pass lists are kept:
  # docs/decisions/FALSE-SUCCESS.md and docs/decisions/PROMPT-LENGTH.md.
  # To put it back, recover the entry from git history (it was removed in the
  # commit that added this note) -- everything in it was measured.

  qwen-image:
    label: "Qwen Image 2512"
    dt_filename: "qwen_image_2512_i8x.ckpt"
    # Qwen-Image-2512, civitai.com/models/2268063 (Civitai official),
    # version "bf16" -- the unquantised weights this build converts.
    civitai_version_id: 2552957
    # The text-to-image half of the family whose editor ships here as
    # qwen-edit: a 20B MMDiT with a Qwen2.5-VL-7B text encoder, and the same
    # ~20GB on disk. Draw Things recommends UniPC Trailing, 30 steps, CFG 4.
    # It renders beautifully and it is by far the most expensive thing here
    # that is not a video model -- see the step ceiling below before changing
    # any number in this entry.
    sampler: "UniPC Trailing"
    cfg: 4.0
    # CFG 4 is real classifier-free guidance, so unlike qwen-edit (CFG 1) a
    # negative prompt does something here. NOT measured -- no render has been
    # spent comparing one against none on this model; it is on because that is
    # what every other CFG>1 model here does.
    uses_negative_prompt: true
    prompt_style: prose
    prompt_guidance: |
      Write natural, descriptive prose of 30-90 words: subject and appearance,
      action, environment, lighting, camera and composition, style and mood.
      Full sentences work well; front-load the subject. Never use negative
      phrasing: state the desired quality positively. No tag lists, no
      weighting syntax.
    # Measured (docs/decisions/PROMPT-LENGTH.md), ten renders at this entry's
    # own 1024/12, two seeds, scored by colour mask. The roomiest model here
    # after Juggernaut: the subject still holds 34-37% of frame height at 410
    # characters, the same as it does at 269, and only falls to ~20% by 622 --
    # so the collapse is between 410 and 622 and `full` sits below it. At 821
    # characters the whole prompt is still being acted on: bandstand,
    # signpost, litter bin, pigeons and chain fence all render, and the
    # balloon marker is small but unmistakable. `fading` is where the ladder
    # stopped rather than a cliff anybody found.
    prompt_budget: { full: 400, fading: 800 }
    # 864, below the 1024 final, because of the step ceiling below. Checked
    # again at the turbo recipe (research/aspect/qwen-image/*__turbo.png,
    # seeds 1111 and 2222): 14 of 14 returned, 13 with one figure; 4:3 at
    # 1111 drew two women. At a 1536 budget with turbo, 8 of 14 came back
    # empty -- see the option's note. At a 1024
    # budget 3:4 and 4:3 (896x1152, 1152x896) render correctly against square
    # controls at the same prompt and seeds -- but 16:9 is 1344x768, over the
    # ceiling, and came back empty at one seed of two. 864 is the largest
    # budget whose widest shape keeps a 1152 long edge (16:9 is 1152x640, 3:2
    # 1088x704, 4:3 1024x768), and 1152x12 is a row that rendered three times
    # out of three. MEASURED at 864 on every ratio (seed 1111) and on 16:9 and
    # 9:16 again at 2222: 8 of 8 returned an image, one figure each, 144-156s
    # (research/aspect/). Square keeps 1024; the 768 draft is under the budget.
    # Raising final.steps from the gear lowers the ceiling for shapes first.
    aspect_size: 864
    # ...and it is a ceiling, not a composition budget: the frames above it
    # come back EMPTY, so a Faithful keeps to it as well, where the SDXL
    # entries' Faithfuls do not (app/schemas.py, ModelSpec.shaped_cap). The
    # app only tiles at 2048 and up, so tiled_diffusion below does not lift it.
    aspect_size_is_ceiling: true
    #
    # THE STEP CEILING, and it is the whole story of this entry. Above a
    # certain amount of work per request Draw Things runs the render to
    # completion and then answers 200 with an empty `images` list -- the same
    # response a stalled session gives, which is what made this hard to read.
    # It is not a stalled session: every cell below was bracketed by a 256px
    # control render on another model, and all of those came back in 3-20s.
    # Sizes are long edge x steps.
    #
    #   1024 x 12   209s, 203s + 12 more   image   <- what this entry ships
    #   1152 x 12   241s, 270s, 279s       image   (the 3:4 and 4:3 shapes)
    #   1344 x 12   195s EMPTY / 255s image        <- flaky, both seeds shown
    #   1024 x 16   280s, 278s             EMPTY   <- DID NOT REPRODUCE, see below
    #   1024 x 20   323s                   EMPTY
    #   1024 x 30   479s                   EMPTY   <- DT's own recommendation
    #    768 x 12   128s                   image   <- what the draft ships
    #    768 x 20   175s, 205s             EMPTY
    #    512 x 20   110s                   image
    #
    # RE-CHECKED 5 September 2026 and the 1024x16 row above did not reproduce:
    # both scenes rendered clean, 273s and 278s, correct size, nothing flat.
    # 1024x16 is 16384 on the long-edge x steps measure, i.e. past the ~15300
    # the threshold below predicts should usually fail. So either the threshold
    # moved under a Draw Things update, or that cell was read in one of the
    # degraded sessions docs/decisions/FALSE-SUCCESS.md documents -- which is
    # exactly the failure mode that has already invalidated one whole batch of
    # measurements here. The table is kept as it was recorded; treat the
    # threshold as unproven rather than as a rule, and re-check before relying
    # on it.
    #
    # It is not a timeout: 768x20 failed at 175s while 1024x12 succeeded at
    # 209s. It is not pixel count: 896x1152 and 1344x768 are the same area at
    # the same step count and behave differently. What fits every row is
    # roughly long-edge x steps, with everything at or under ~13800 returning
    # an image and everything at or above ~15300 usually not. But 1344x12
    # (16128) failed at one seed and succeeded at another, so past the
    # threshold this is unreliable rather than dead -- and the threshold is a
    # line fitted to nine points, not a mechanism. Rely on the rows, not the
    # formula, and do not promote a single failure here to a rule without
    # re-running it at another seed: 1344x12 reads as a clean cliff until you
    # do, and then it does not.
    #
    # Operationally: Draw Things' recommended 30 steps DOES NOT WORK here, 12
    # works at every size tried, and any number raised in this entry has to be
    # re-measured rather than assumed.
    draft: { size: 768, steps: 12 }
    # 12 kept, and checked at 8 / 12 / 16 on two crowded scenes
    # (docs/decisions/FINAL-STEPS.md; frames in research/final-steps/): good at
    # 12, better at 16 -- it was the only model in the whole sweep to render the
    # cat's face undistorted -- so 12 is a stop at 211s against 275s, not a
    # ceiling. Raise it if a frame is worth the extra minute.
    #
    # It also shows the same persistent noise pattern as some other models here,
    # present at every rung. See the shared-autoencoder note in
    # docs/decisions/FINAL-STEPS.md: every model anyone has seen it on runs the
    # Qwen VAE, which would make it neither a step count nor a checkpoint.
    final: { size: 1024, steps: 12, strength: 0.5 }
    upscale: { size: 2048, steps: 8, strength: 0.3 }
    # Measured, and the good news in this entry: 2048 comes back clean at 0.991
    # correlation with its source in 200s, faster than the 1024 final that fed
    # it. That is also the best evidence for what the ceiling above actually is
    # -- a tiled 2048 pass is far more total work than the 1024x16 render that
    # returns nothing, and the difference between them is that tiling bounds
    # the memory. Its sibling qwen-edit needs this flag at 2048 for the same
    # reason, and is the same size class.
    tiled_diffusion: true
    upscale_seconds: 442
    # Measured: 4096 returns an empty response after 511s, on a session whose
    # control renders came back in 12-14s either side. tiled_diffusion is what
    # gets this model to 2048 at all, and the Upscale picker was reading that
    # flag as "so 3K and 4K are fine too" -- it was offering an eight-minute
    # render that produces nothing. 3072 was not tested; the cap is the last
    # size measured good, not a known ceiling.
    max_upscale_size: 2048
    # Wuli-art's Qwen-Image-2512 Turbo LoRA (Civitai 2267786, version
    # 2552570), imported by hand. Not the lightx2v Lightning LoRA in Draw
    # Things' own list: that one never finishes a render on this i8x build
    # once weight x prompt length x frame size adds up -- a real prompt at
    # 1024 fails even at weight 0.3 (research/qwen-lightning/results.json).
    # This one renders every cell at weight 1.0.
    #
    # Measured against the shipped 12 steps at CFG 4, both final-steps
    # scenes, seed 1111 (research/qwen-turbo/, SHEET__compare.png): the same
    # photographic look, and MORE of the prompt on the frame -- freckles, the
    # lace weave, the loupe, the cash tin and the cat -- at 4 steps in ~50s
    # against 211s. Not for free: skin comes out harsher, heavier freckles
    # and harder contrast where the shipped pass is soft and natural (the
    # distilled look), and at 4 steps small things -- the fish, the coins --
    # are a touch softer, with the ground behind them blurrier. 8 steps
    # brings the fish back for 85s at 1024, which at 1536 is the shipped
    # pass's time again, so 4 is the default and the gear's step box is the
    # dial for a picture worth 8. A 768 draft at 4 steps takes 35s (134s
    # recorded before) and its Faithful lands on it. CFG 1, so no negative
    # prompt.
    #
    # The final stays at 1024, and this is the part worth not re-deriving.
    # 1536 x 4 is far under the step ceiling and the two probe scenes
    # rendered at 1536 in ~105s, sharper at 1:1 than 1024 -- but the aspect
    # sweep's sunflower prompt at 1536 comes back EMPTY every time (Draw
    # Things draws nothing), at weight 1.0 and 0.6, while 0.8 renders it.
    # That is the lightx2v Lightning failure again, further out and not
    # monotonic in anything, so 1536 is a coin flip per prompt and an empty
    # reply is what the app reads as a stalled renderer. 1024 and the 864
    # shape budget: 14 of 14 shapes, every probe cell, no empties.
    #
    # The upscale follows the tick too, so the tick means "this model runs
    # with the LoRA" and not every picture has skin in it: measured on the
    # portrait (research/qwen-turbo/upscale.json, SHEET__upscale.png), the
    # LoRA pass at the model's 8 steps takes 252s against 442s at 0.97
    # correlation with the enlarged init either way, and hardens the skin
    # the same way the finals do. Untick it for a portrait worth the softer
    # pass. Both measured times are far from the 200 that shipped as
    # upscale_seconds, which is now the plain figure.
    #
    # 4 steps, not 8, for the upscale as well: that first LoRA pass was
    # rendered at 8 only because the entry below once set cfg and nothing
    # else, so the model's own count leaked through. The 4-step cell (196s,
    # 0.970) is the better frame at 1:1 -- the freckles and pores come back
    # closer to the plain pass's soft skin, not the 8-step pass's hard,
    # over-contrasted ones, and hair strands, lashes and the loupe rim are
    # as clean. At strength 0.3 it is one or two denoise steps whichever
    # count is set, so most of the 196s is the tiled 2048 pass itself, not
    # the steps.
    lora_options:
      - key: turbo
        label: "Turbo (4 steps)"
        file: "wuli_qwen_image_2512_turbo_lora_4steps_v1.0_bf16_comfyui_lora_f16.ckpt"
        negative_prompt: false
        civitai_version_id: 2552570
        stages:
          draft: { steps: 4, cfg: 1.0 }
          final: { steps: 4, cfg: 1.0 }
          upscale: { steps: 4, cfg: 1.0 }

  qwen-edit:
    label: "Qwen Edit 2511 (instruct)"
    dt_filename: "qwen_image_edit_2511_i8x.ckpt"
    # Qwen-Image-2512, civitai.com/models/2268063 (Civitai official),
    # version "Image Edit 2511": the editor ships as a version of that
    # page rather than one of its own.
    civitai_version_id: 2558804
    sampler: "Euler A Trailing"
    cfg: 1.0
    uses_negative_prompt: false
    prompt_style: prose
    # instruction editor: takes the image plus plain words ("change the dress
    # to red") and rewrites only what the instruction touches. Not a generator;
    # no chip, only the Instruct action on image cards.
    edit_only: true
    # The largest model here at ~20GB, and the one that looked like a memory
    # problem: with only tiled_decoding, 2048 returned a flat colour field
    # after ~5 minutes and reported success, and with no tiling at all it ate
    # the machine's RAM until Draw Things had to be killed by hand.
    # tiled_diffusion turns out to fix both symptoms -- 2048 comes back at
    # 1.000 correlation with the source and memory stays bounded. It is slow
    # (~12 min) because of the model's size, not because of the tiling.
    tiled_diffusion: true
    upscale_seconds: 721
    # Without the LoRA option below, step count matters more than it looks --
    # scale it to how much has to be painted from nothing: 8 for colour
    # changes only, 16 to remove or replace something, 24+ to add a new
    # highly detailed object. Under-stepping comes out washed out and soft.
    # Every instruction edit goes through this stage -- Instruct, a rectangle
    # addition, Combine -- and all three dialogs seed their steps from it.
    # NOT MEASURED, and the probe would not describe it: this is an instruction
    # editor, so its prompt is a short edit instruction against an existing
    # image ("make the sky overcast"), not a scene description. Its prompts sit
    # far inside any budget. Left at the default.
    prompt_budget: { full: 240, fading: 600 }
    draft: { size: 768, steps: 8 }
    final: { size: 1024, steps: 16, strength: 1.0 }
    # Ticked by default: 4 steps instead of 16. Measured on one scene, same
    # seed, against 16 steps without it (research/lightning-edit/,
    # docs/decisions/EDITING.md decision 16): ~95s against ~320s, and the
    # rest of the frame held as well or better every time. A colour change
    # came back the same picture; a rectangle addition and Combine came back
    # better. A whole-image addition came back crisper but on a flat dark
    # contact shadow. A replacement did not work: with the LoRA, at 4 and 8
    # steps alike, the barrel was set down in front of the plant, leaves still
    # showing; without it the barrel took the pot's place. That is what the
    # tick is for. More steps on the LoRA are not the fix -- 8 came back the
    # same picture as 4 in twice the time.
    lora_options:
      - key: lightning
        label: "Lightning (4 steps)"
        file: "qwen_image_edit_2511_lightning_4_step_v1.0_lora_f16.ckpt"
        stages: { final: { steps: 4 } }
    upscale: { size: 2048, steps: 8, strength: 0.3 }

# To add a model:
#   1. Download it in Draw Things. The exact quantisation doesn't matter: the
#      server matches any variant of that filename (q8p, i8x, f16...) in
#      models_dirs, and hides the chip when none is installed.
#   2. Run the harness. It does the measuring, and prints an entry:
#        uv run python scripts/add_model.py --model <file> --key <key>
#      Add --tags for a Danbooru/booru checkpoint, --level quick to halve the
#      render count on a slow model.
#   3. Look at the images it names -- duplicated subjects in the size grid,
#      whether the draft looks like its final, whether the portrait and wide
#      cells composed correctly against their square controls -- and fill the
#      TODOs it left. It cannot judge those, and it does not pretend to.
#   4. Write prompt_guidance yourself, from the model's card. That is the
#      model's dialect, not a measurement.
# Everything else has a workable default -- see ModelSpec in app/schemas.py
# for the full field list, and docs/ADDING-A-MODEL.md for the steps; the
# harness measures what it measures and reasons about the rest.
#
# The one thing worth knowing before you start: Draw Things already caches its
# own recommended sampler, steps and cfg for every model it ships, and the
# harness reads them. Don't probe for settings the app already knows.

# Image-to-video models for the Animate action. Separate from `models` above
# because none of the draft/final/upscale staging applies: a video job is one
# shot at one size, and the only two useful dials are clip length and model.
#
# Settings below are measured, not guessed (see the numbers per entry). Two
# things learned the hard way and worth not re-deriving:
#   - Draw Things floors each side of a video request to a multiple of 64, so
#     832x480 comes back 832x448; never assume output dimensions match the
#     request. The width/height below are a pixel budget rather than a fixed
#     shape: each clip is requested in its own still's aspect at roughly this
#     area (clip_size in app/video.py), so a square image is not squashed.
#
# To add one: label, dt_filename and a width/height pixel budget are enough to
# start; steps/cfg/motion_scale default sensibly (VideoModelSpec in
# app/schemas.py). Measure sec_per_frame the same way FusionX's was: time a
# real clip and divide.
#
# Only FusionX ships. AniSora v3.2 was measured here and removed -- it returned
# the start frame back motionless every time, over four configurations, at up
# to an hour a clip, and the mixture-of-experts support it needed went with it.
# docs/decisions/VIDEO.md is the record, and is worth reading before adding
# another anime-tuned I2V model or another Wan 2.2 A14B pair.
video_models:
  fusionx:
    label: "Wan 2.1 14B I2V FusionX"
    dt_filename: "wan_2.1_14b_i2v_fusionx_q8p.ckpt"
    # Accelerator LoRAs are baked in, so 8 steps at CFG 1 is correct and more
    # steps only cost time. Held detail perfectly at both 33 and 81 frames
    # (sharpness retention 1.07 and 1.25, i.e. no decay at all).
    steps: 8
    cfg: 1.0
    width: 832
    height: 480
    # measured 17.1 s/frame at 33 frames and 22.8 at 81: cost grows as roughly
    # frames^1.32, so the estimate uses the longer-clip figure
    sec_per_frame: 22.8
