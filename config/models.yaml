# Model registry for the image pipeline.
# dt_filename names the model file Draw Things writes. A different quantisation
# of the same model is matched at startup (Registry.resolve_installed), so an
# install never edits it; scripts/probe.py shows what was found.
# Leave dt_filename empty to hide a model from the UI.
#
# cfg maps to cfg_scale in the Draw Things API (guidance for FLUX-family models).
# sampler: always set. A null sampler leaves sampler_name out of the request
# and Draw Things renders with whatever its UI is left on
# (docs/decisions/MODEL-MEASUREMENTS.md).
#
# draft.steps and final.steps here are the shipped defaults, and the value the
# UI's Reset returns to. An install can change either from the gear in the
# header, which writes to settings.json in the data directory rather than back
# to this file -- so on a machine that has done so, the number rendering is not
# the number below. Nothing else on a stage is overridable, upscale.steps
# included: it is tuned as a pair with upscale.strength.

llm:
  # Ollama model used for prompt enrichment, refinement and image describe.
  # Must be a vision model: the "From image..." flow sends the image to this
  # same model, so a text-only build (e.g. plain qwen3:8b) breaks it.
  # gemma3:12b balances vivid prompt writing with speed and disk footprint.
  # gemma3:27b writes even better prose but needs ~17GB disk and is 2x slower;
  # qwen3-vl:8b is the lightest option and sticks closer to the typed prompt.
  model: "gemma3:12b"
  host: "http://127.0.0.1:11434"
  temperature: 0.9
  # Seconds to wait for one /api/chat reply. Generous, because the first call
  # after a model switch pays to load the model into memory too. A call that
  # exceeds it is not retried automatically -- that would spend the same wait
  # twice before anyone is told anything -- the page offers Retry instead.
  request_timeout: 300

draw_things:
  host: "http://127.0.0.1:7860"
  # seconds before a single generation request is abandoned
  request_timeout: 900
  # Folders scanned to detect which models are installed and to match
  # quantisation variants (q8p vs i8x vs f16...) automatically. ~ expands.
  models_dirs:
    - "~/Library/Containers/com.liuliu.draw-things/Data/Documents/Models"
    - "~/Pictures/models"
  # Upscalers used to enlarge the init image before an upscale pass, in
  # preference order: the first one installed wins. Download them inside Draw
  # Things (Official Upscalers); this script cannot fetch them.
  #
  # This step matters more than the pass itself. img2img needs its init at the
  # output size, and a plain Lanczos enlargement of a 768px draft is soft --
  # at the low strength an upscale runs, the model has neither structure to
  # sharpen nor licence to invent any, so a blurry init stays blurry.
  #
  # Laplacian variance of a 768px draft enlarged to 2048, warm runs, denoiser
  # off (semi-real / anime source):
  #   Lanczos                       16 /   8
  #   Real-ESRGAN x4plus (ncnn)     97 /  54
  #   UniversalUpscaler V2 Sharp   110 /  28
  #   Remacri                      143 /  33
  #   4x UltraSharp                371 / 312   <- and no ringing, checked by eye
  # UltraSharp wins on both kinds of content by a wide margin, and Remacri and
  # UniversalUpscaler are actively bad on anime -- below even the ncnn binary.
  # See docs/decisions/UPSCALING.md.
  upscalers:
    - "4x_ultrasharp_f16.ckpt"
    - "remacri_4x_f16.ckpt"
    - "esrgan_4x_universal_upscaler_v2_sharp_f16.ckpt"
    - "realesrgan_x4plus_f16.ckpt"

# Target sizes offered by the Upscale button. Anything above 2048 is only
# reachable because tiled_diffusion decouples canvas size from the model's
# working resolution; cost grows more slowly than area (bas-anima measured
# 38s / 67s / 105s at 2048 / 3072 / 4096, all at 0.996+ correlation with the
# source). The big models are another matter -- Qwen Edit takes ~12 min at
# 2048 alone -- so the picker shows an estimate per size and lets the user
# decide rather than hiding the option.
upscale_sizes: [2048, 3072, 4096]

# Aspect ratios (every ratio in app/dims.py ASPECTS) are set per model via
# aspect_size below: the pixel budget (as a square-equivalent side) to render
# a model at when a non-square shape is asked for. Every model that composes
# has one (tests/test_registry.py holds that line); only an edit-only model,
# which takes its parent's size, goes without.
#
# The app treats that budget as an area and derives both sides from the chosen
# ratio at constant area, landing them on the 64px grid, so a shape normally
# costs no extra time. Often aspect_size is the model's final size.
# It is lower where that size does not hold up -- what a model composes
# correctly at is an AREA, and a configured size is only evidence about the
# area it was measured at. The SDXL entries shape at 1024 under a 1536 final,
# and qwen-image at 864 under its step ceiling. Square is exempt from all of
# this and renders at the configured size.
#
# The budget is not automatically the final size. A square proves the area;
# the long edge is a separate limit. z-image-turbo holds every square and every
# 4:3 at a 1536 budget and doubles its subject at 16:9 (2048x1152).
#
# A new model ships with a best guess -- its final size, or 1024 for SDXL --
# and the guess is then checked where it would break first: the widest shape
# (16:9 or 9:16, the longest edge the budget produces), one seed, a fraction
# of the steps, with scripts/sweep_aspect.py --shapes 16:9 --seeds 1111
# --steps <few> (frames in research/aspect/<key>/; tests/test_registry.py
# insists that cell exists at the size the budget now gives). Look for a
# subject duplicated left/right, a second head or horizon down the frame, or a
# stretched face. If it duplicates, take two controls before blaming the
# ratio: the sweep's square at the same seed, and a re-run after restarting
# Draw Things. A degraded Draw Things session produces duplicated subjects at
# every size and shape while still reporting success. If square is clean and
# the shape is not on a healthy session, step the budget down one grid notch
# at a time until the widest shape holds, and stop there.

models:
  flux2-klein:
    label: "FLUX.2 klein 9B"
    # Pixel budget for a non-square render (see the note above upscale_sizes).
    # Equal to the final size below, i.e. nothing is given up: measured at
    # 832x1216 (correct 3:4 scene, no duplicated subject, 75s) and at 320x192
    # and 192x320 as drafts, all exact and all composed correctly, and the
    # widest shape (1344x768) probed clean at seed 1111, 3 steps
    # (research/aspect/flux2-klein). BFL document FLUX.2 as good to 4MP, well
    # past anything generated here.
    aspect_size: 1024
    dt_filename: "flux_2_klein_9b_q8p.ckpt"
    # FLUX.2 Klein, civitai.com/models/2322332 (Civitai official), version
    # "9B" -- the variant this build is, not the 9B-Base beside it.
    civitai_version_id: 2612554
    # 512px comes back at 0.999 correlation with the source and 2048px at
    # 0.993. It reaches 2048 without diffusion tiling -- just the slowest of
    # the lot at that size.
    supports_img2img: true
    # per BFL's FLUX.2 prompting guide
    prompt_guidance: |
      Write 15-75 words of structured prose in this order: subject, action,
      environment, lighting, camera (angle, lens, depth of field), style.
      Attach colours to specific objects (hex codes allowed, e.g. "the dress
      is #0F52BA"). Use concrete camera and film vocabulary for realism.
      Never use negative phrasing: state the desired quality positively
      ("sharp focus throughout", not "no blur"). Text that should appear in
      the image goes in double quotes. No tag lists, no weighting syntax.
    # DDIM Trailing, Draw Things' recommendation for this checkpoint (sampler
    # 16).
    sampler: "DDIM Trailing"
    cfg: 1.0
    uses_negative_prompt: false
    # Measured (docs/decisions/PROMPT-LENGTH.md): a marker sentence at the very
    # end of the prompt still rendered clearly at 860 characters, and the
    # subject stayed a reasonable size throughout -- the mildest decay of any
    # model here apart from Juggernaut.
    prompt_budget: { full: 450, fading: 900 }
    # 768, accepted on its Faithful (docs/decisions/DRAFT-STEPS.md). The
    # Faithful over a 512 draft is soft: at 1:1 the lace collar is blobs, the
    # linen is flat and the hair has no strands, where the same seed from a
    # 768 draft resolves all three (research/draft-size/flux2-klein). 47s a
    # draft on an idle M4 Pro; the Faithful is 193s.
    #
    # The Faithful's own levers do not help a soft init: 32 steps and strength
    # 0.7 each come back as the same picture as 16 at 0.5, and a bigger
    # Faithful frame (1536 budget) is softer per pixel for 525s against 193s
    # (DRAFT-STEPS.md, "A Faithful size of its own"). No faithful_size here.
    draft: { size: 768, steps: 6 }
    # FLUX.2 supports up to 4MP; 1536 finals look outstanding but cost ~9 min
    # on M4 Pro, so default to 1024 (flip size to 1536 for keeper images)
    #
    # 8 steps, and this entry is the one place in the file where the step count
    # is NOT a quality ceiling. Swept at 4 / 16 / 32, two scenes
    # (docs/decisions/FINAL-STEPS.md; frames in research/final-steps/):
    #   4   smoother textures        53s
    #   16  more detail, more realistic   181s
    #   32  excessive                354s
    # 4 and 16 are both good and they are different pictures in kind, not in
    # quality -- which of the two you want is an artistic choice about this
    # model, not a measurement. 32 buys nothing over 16 for twice the time.
    #
    # 8 is the default because a default has to be one number and the middle of
    # a range nobody can rank is the honest place to stand. Anyone who wants the
    # other end moves it in the gear dialog, per model, which is what that
    # dialog is for. Do not read this 8 as "the point where klein stops
    # improving" -- it demonstrably keeps improving to 16.
    final: { size: 1024, steps: 8, strength: 0.5 }
    upscale: { size: 2048, steps: 12, strength: 0.3 }
    upscale_seconds: 340

  flux3-klein:
    label: "FLUX.3 klein 5.6B"
    # Draw Things records a new architecture for it (flux3_5b, Qwen3-VL 4B
    # text encoder, the FLUX.2 VAE). FLUX.2 klein's budget, and its widest
    # shape (1344x768) probed clean at seed 1111, 4 steps: one figure, the
    # scene intact (research/aspect/flux3-klein).
    aspect_size: 1024
    dt_filename: "flux_3_klein_q8p.ckpt"
    # Flux.3 Klein, civitai.com/models/3003556 (CivitaiOfficial), version
    # "Klein" -- the distilled build Draw Things ships, not the Klein-Base
    # beside it.
    civitai_version_id: 3407486
    # Measured: the Faithful over a 768 draft is as sharp at 1:1 as a fresh
    # final (research/draft-size/flux3-klein), and a 2048 img2img pass comes
    # back untiled at 0.989 correlation with its source in 169s, with detail
    # repainted rather than enlarged (research/final-steps/flux3-klein/
    # *2048_untiled*, RUNS.md there).
    supports_img2img: true
    # Draw Things' note: "Write full scene captions covering framing, subject,
    # background and lighting; short prompts give generic output."
    prompt_guidance: |
      Write a full scene caption of 40-90 words in prose: framing and camera
      (shot size, angle, lens, depth of field), then the subject and what it
      is doing, then the background, then the lighting, then the style. Attach
      colours and materials to specific objects. State the desired qualities
      positively ("sharp focus throughout", not "no blur"). Text that should
      appear in the image goes in double quotes. No tag lists, no weighting
      syntax.
    # DDIM Trailing, as FLUX.2 klein: Draw Things' catalogue has no saved
    # configuration for this model, only "16 steps, Text Guidance 1 and Shift
    # 16" in its note, and every frame below rendered clean on it. Shift
    # cannot be set over the HTTP API for stills (app/dt_client.py), so Draw
    # Things' own value applies.
    sampler: "DDIM Trailing"
    cfg: 1.0
    uses_negative_prompt: false
    # Measured with add_model.py's ladder at 512 and the draft's 8 steps (the
    # text encoder decides what reaches the picture, not the pixel count):
    # the subject holds to 410 characters and falls at 622, and the marker
    # sentence at the very end still renders at 821 (research/add_model/
    # flux3-klein, *_d512_*). A little short of klein 9B's 450/900, with a
    # different text encoder (Qwen3-VL 4B against Qwen3 8B).
    prompt_budget: { full: 400, fading: 800 }
    #
    # 768 at 8 steps, accepted on its Faithful (DRAFT-STEPS.md's rule): 28-35s
    # a draft, and the Faithful over it holds freckles, hair strands and the
    # chalkboard lettering at 1:1.
    draft: { size: 768, steps: 8 }
    # 16, Draw Things' recommendation, and where it stops improving: swept at
    # 8 / 16 / 24 on both scenes (research/final-steps/flux3-klein). 8 is
    # already sharp at 1:1 (51s); 16 resolves the lantern lettering and the
    # market's clutter more coherently (104s); 24 is indistinguishable from
    # 16 at 1:1 (150s), and on the market seed it drew a second cat. The
    # portrait barely moves from 8 to 24 -- 8 in the gear dialog is a fair
    # trade for speed.
    final: { size: 1024, steps: 16, strength: 0.5 }
    upscale: { size: 2048, steps: 12, strength: 0.3 }
    upscale_seconds: 170

  flux1-schnell:
    label: "FLUX.1 schnell"
    # Supported, not recommended: the same FLUX text-to-image stack as klein
    # above, a generation older and capped lower, so installing both buys
    # little. Apache-2.0, as is z-image-turbo, which is newer and faster. Inert
    # when the file is absent (the chip hides itself).
    aspect_size: 1024
    dt_filename: "flux_1_schnell_q8p.ckpt"
    # FLUX, civitai.com/models/618692, version "Schnell".
    civitai_version_id: 699279
    # Euler A Trailing, Draw Things' recommendation for this checkpoint
    # (sampler 10).
    sampler: "Euler A Trailing"
    cfg: 1.0
    uses_negative_prompt: false
    prompt_guidance: |
      Write one flowing prose paragraph of 30-60 words. Order: subject and
      appearance, action, environment, lighting, camera angle, style.
      Front-load the most important content in the first sentence. Never use
      negative phrasing ("sharp focus", not "no blur"). No tag lists, no
      weighting syntax, no artist names.
    # Not measured: this model is supported rather than recommended (see
    # docs/SETUP.md), and the tightest shipped budget is the safe assumption.
    # Probe it as docs/decisions/PROMPT-LENGTH.md describes if it matters.
    prompt_budget: { full: 240, fading: 600 }
    # 768 is the floor for every draft's long side (tests/test_registry.py): a
    # draft is what a Faithful enlarges, and its pixels are what it can carry.
    draft: { size: 768, steps: 4 }
    # FLUX.1 is a 0.1-2MP model; 1024 is its sweet spot, use Upscale for more
    final: { size: 1024, steps: 6, strength: 0.5 }
    upscale: { size: 2048, steps: 4, strength: 0.3 }
    upscale_seconds: 145

  z-image-turbo:
    label: "Z-Image Turbo"
    # Below the 1536 final. At a 1536 budget (research/aspect/z-image-turbo,
    # seeds 1111/2222, 4 steps) it holds one figure at 4:3 (1792x1344) and 3:2
    # (1856x1280) and draws two women, two trees and a second horizon at 16:9
    # and 9:16, the two shapes with a 2048 long edge -- 4 of 4 cells. One grid
    # step down, 1984x1088 (this budget's 16:9, seed 1111, 2 steps) is one
    # figure, so the line is between 1984 and 2048 and the budget sits just
    # under it. 1280 is clean on every shape (14 of 14).
    aspect_size: 1472
    dt_filename: "z_image_turbo_1.0_i8x.ckpt"
    # Z Image Turbo, civitai.com/models/2168935 (Civitai official); the
    # page has one version.
    civitai_version_id: 2442439
    # Tongyi's 6B DiT, step-distilled, with a Qwen3-VL-4B-Instruct text encoder
    # and the FLUX.1 VAE. Draw Things' own recommendation is UniPC Trailing at
    # 8 steps and CFG 1 -- its catalogue note says trailing samplers are what
    # this model wants, and both were used for every measurement below.
    # Apache-2.0, so this and FLUX.1 schnell are the two permissively licensed
    # generators here.
    sampler: "UniPC Trailing"
    cfg: 1.0
    uses_negative_prompt: false
    prompt_style: prose
    prompt_guidance: |
      Write natural, descriptive prose of 30-90 words: subject and appearance,
      action, environment, lighting, camera and composition, style and mood.
      Full sentences work well; front-load the subject. Never use negative
      phrasing: state the desired quality positively. No tag lists, no
      weighting syntax.
    # Measured (docs/decisions/PROMPT-LENGTH.md), two seeds, scored by colour
    # mask rather than by eye: the balloon marker survives at every length
    # tested, down to about a sixth of its short-prompt area at 820 characters,
    # so the tail is never lost outright. `full` comes from the subject curve
    # as it does everywhere else -- the coat holds 27-32% of frame height at
    # 268 characters and 18-19% at 409, so the collapse is in that gap and the
    # budget sits below it. `fading` is where the ladder stopped, not a cliff
    # anybody found.
    prompt_budget: { full: 260, fading: 800 }
    # 8 steps: measured at 1024, seed 4242, 4 steps 30s, 8 steps 43s, 12 steps
    # 64s, 16 steps 84s. Coherent and photographic at 4, no change after 8.
    # 768, accepted on its Faithful (DRAFT-STEPS.md): the Faithful is a 2x
    # enlargement here (768 -> 1536). From a 512 draft the same seed comes back
    # smeared -- the vendor's face is paint, the fish have no scales, the chalk
    # lettering is mush, the portrait's skin is airbrushed wax -- where 768
    # resolves face, knit, chalk strokes and pores (research/draft-size/
    # z-image-turbo, seed 1111, both scenes). 22-32s a draft; the Faithful is
    # 133s. Nothing above 768 was tried.
    draft: { size: 768, steps: 8 }
    # 1536: square finals measured clean at 1024 (43s), 1280 (73s) and 1536
    # (119s), seeds 1111/2222/3333/4242 per SHAPES.md -- single subject in 12
    # of 12 cells. The top of what was measured, taken at ~3x the time because
    # a final is rendered once and looked at for a long time; still the fast
    # model at that size (FLUX.2 klein takes ~9 minutes). 8 steps: swept at
    # 8 / 16 / 24 on two crowded scenes (docs/decisions/FINAL-STEPS.md; cells
    # in research/final-steps/), practically no difference, at a third of the
    # cost of 24 (122s against 348s).
    final: { size: 1536, steps: 8, strength: 0.5 }
    # Untiled, 2048 comes back speckled -- fine noise over every flat area
    # (sky, water) -- while correlating 0.9894 with its source, so the "flat
    # while reporting success" test that turns this flag on elsewhere would
    # pass it; only looking at the image shows it. tiled_diffusion clears it:
    # 0.9952, clean by eye, 62s against 51s.
    upscale: { size: 2048, steps: 8, strength: 0.3 }
    tiled_diffusion: true
    upscale_seconds: 62
    # No max_upscale_size: 4096 comes back clean in 181s, so the 3K and 4K the
    # picker offers on the strength of tiled_diffusion hold here.

  lustrousmix-anima:
    label: "LustrousMix Anima"
    # Below the 1536 final: 16:9 at that budget (2048x1152, seed 1111, 12
    # steps, research/aspect/lustrousmix-anima) draws two women, one grid
    # step down (1984x1088, 8 steps) draws one. Same line as z-image-turbo
    # and bas-anima (docs/decisions/SHAPES.md).
    aspect_size: 1472
    # its guidance below asks for exactly this and no other quality tags; the
    # shared default opener ("very aesthetic", "absurdres" -- Illustrious
    # vocabulary, see DEFAULT_TAG_PREFIX) is foreign to a Cosmos model
    quality_prefix: "masterpiece, best quality"
    # the negative its own card asks for, used whenever a generation arrives
    # without one (your prompt as written, or no enrichment at all). The score
    # tags are Pony-derived vocabulary this base understands and the shared
    # default does not carry, which is why the floor is per model.
    negative_prefix: "worst quality, low quality, jpeg artifacts, signature, sepia, fewer digits, extra digits, bad hands, bad anatomy, watermark, censored, score_1, score_2, score_3"
    dt_filename: "hosekilustrousmixanima_animav10_f16.ckpt"
    # LustrousMix Anima v1.0.
    # Only used when publishing an image made with it: it is what
    # attributes the checkpoint on the Civitai post, since a converted
    # .ckpt cannot be matched by hash. Update it with the weights.
    civitai_version_id: 2982979
    # Draw Things' converted file, found under any name (ModelSpec.fingerprints)
    fingerprints: ["2b9883a22277e17c6b3e15ecb371b000d1f440da607c057240f722828448d02b"]
    # Anima Base v1: Cosmos 2.5 (2B) architecture, NOT SDXL. SDXL LoRAs
    # (e.g. DMD2) are incompatible, and clip_skip does not apply.
    # Card: Euler a (or ER SDE), 24 steps, cfg 4-5.
    sampler: "Euler a"
    cfg: 4.5
    uses_negative_prompt: true
    prompt_style: tags
    # Anima base: prose in Danbooru wording. Measured best of five prompt forms
    # here (97%), and the only form that placed one object relative to another.
    # Artist-style tags are explicitly supported by the card.
    prompt_guidance: |
      Start every prompt with exactly "masterpiece, best quality" (no other
      quality tags), then describe the picture in prose -- ordinary sentences,
      about 60-90 words -- using Danbooru's exact wording wherever it has a
      word for what you mean (1girl, twin braids, from above, looking at
      viewer) and plain English wherever it does not. Cover subject count
      first, then character and series when the subject is a known character,
      appearance, clothing, expression and pose, scene, lighting, composition
      and style. Say which subject has which feature and where each thing is
      in sentences; that is what this form is for. Artist-style names are
      allowed and effective. Only when the instruction actually asks for words
      to appear in the picture, put those words in quotes; never invent any.
      Every negative_prompt must start with "worst quality, low quality, jpeg
      artifacts, signature, sepia, fewer digits, extra digits, bad hands, bad
      anatomy, watermark, censored, score_1, score_2, score_3" and may append
      scene-specific tags to avoid.
    # Measured. `full` is 240 because the subject-size curve decides it and
    # that curve collapses immediately after 236 characters: the subject holds
    # 52% of frame height at 236 and 22% at 393. `fading` is higher than
    # BAS+'s because the end-of-prompt marker survives further here -- solid
    # at 393, a speck by 592 and still a speck at 860.
    prompt_budget: { full: 240, fading: 600 }
    # UniPC Trailing at 12 steps: 35.3s a draft at 768, indistinguishable from
    # Euler a at 20 (57.7s) across several seeds on a portrait and a crowded
    # scene. 16 (46.5s) is the place to go if a scene ever looks thin
    # (docs/decisions/MODEL-MEASUREMENTS.md).
    #
    # DO NOT use DPM++ 2M Karras on this checkpoint: it returns pure noise at
    # 12 and 16 steps -- a lavender speckle field with no subject, reported as
    # a success. It belongs to the Anima/Cosmos base, not to a Turbo LoRA.
    #
    # 768, the floor for every draft's long side (tests/test_registry.py).
    # 640, 768 and 1024 all come back crisp through the 48-step Faithful at
    # 1:1 -- lashes, freckles, pearls, watch numerals; sign strokes and eyes
    # (research/draft-size/lustrousmix-anima/, RUNS.md). A Faithful over a 640
    # draft of a near-black 3:2 scene lost the draft's crown lace to a blur
    # (DRAFT-STEPS.md, "Shaped Faithfuls").
    draft: { size: 768, steps: 12, cfg: 4.5, sampler: "UniPC Trailing" }
    # 24 steps, a stop at the knee rather than a ceiling: swept at 16 / 24 / 40
    # on two crowded scenes (docs/decisions/FINAL-STEPS.md; frames in
    # research/final-steps/), 24 is clearly better than 16, and 40 is better
    # again though much less obviously, at 623s against 370s. 1280 is worse
    # than 1536. This stage is a fresh txt2img, not img2img over the draft --
    # only Faithful/Upscale/Detail/Edit take that path (app/main.py) -- so
    # the draft's settings do not carry into it.
    final: { size: 1536, steps: 24, strength: 0.5 }
    # The Anima Turbo LoRA (Civitai 2560840, v0.2; the one BAS+ has baked in),
    # imported into Draw Things by hand. Final at 8 steps and CFG 1 measured
    # against 24 at CFG 4.5 on both final-steps scenes, seed 1111
    # (research/final-steps/lustrousmix-anima/, SHEET__turbo_compare.png):
    # ~67s against ~375s, nothing broken -- hands, glasses, lace and lettering
    # clean, more of the prompt drawn -- but a different picture: warmer,
    # darker, more painterly, the bright flat anime colour mostly gone. 0.7
    # does not bring the look back, it goes muddy and low-contrast; the
    # weight is not a style dial. CFG 1 also means no negative prompt.
    #
    # Drafts go to 1024 with it, as the draft's job as an init rather than as
    # a preview: research/draft-size/ (both Anima models,
    # SHEET__turbo_drafts.png). A 640 turbo draft looks fine at 11s, but the
    # Faithful over it comes back soft at 1:1 -- hair and eyes smeared, as if
    # upscaled -- where the one over a 1024 draft (26s) has lashes, freckles
    # and the glasses' metal. A 16-step CFG 1 pass at 0.5 cannot put back
    # what the draft lacked. The same size BAS+ (this LoRA baked in) uses.
    #
    # "anime coloring" rides with it, as the LoRA's page asks and as BAS+'s
    # opener already carries (research/anima-turbo/SHEET__anime_coloring.png,
    # both scenes, seed 1111, 67s -- no cost): it brings back how this model
    # draws -- bigger anime eyes, flatter cel shading, a younger face where
    # the turbo alone went semi-real -- but not its colour, which stays the
    # LoRA's warm, dark palette.
    #
    # prompt_budget holds with it: the add_model ladder at the turbo recipe,
    # two seeds (research/anima-turbo/budget.json, SHEET__budget.png) scores
    # full 260 / fading 800 -- the subject falls after ~270 chars as it does
    # at CFG 4.5, and the end-of-prompt marker is still there at 821. So
    # 240/600 serves both states of the tick; BAS+'s short reach is that
    # checkpoint's, not the LoRA's.
    lora_options:
      - key: turbo
        label: "Anima Turbo (8 steps)"
        file: "anima_turbo_lora_v0.2_lora_f16.ckpt"
        negative_prompt: false
        opener: "anime coloring"
        civitai_version_id: 2979642     # Anima Turbo LoRA v0.2
        stages:
          draft: { size: 1024, steps: 8, cfg: 1.0, sampler: "Euler a" }
          final: { steps: 8, cfg: 1.0 }
    # Untiled, this model renders nothing above ~2.4MP: 1536 (2.36MP) is
    # clean, 1792 comes back as flat colour bands and 2048 as one flat
    # colour, both reported as successes. tiled_diffusion fixes it outright
    # (2048 at 0.996 correlation with the source) by keeping each denoised
    # tile inside the resolution the model can actually work at.
    upscale: { size: 2048, steps: 18, strength: 0.3 }
    tiled_diffusion: true
    upscale_seconds: 214

  krea2-turbo:
    label: "Krea 2 Turbo"
    # Measured clean at 896x1152, seed 4242: single subject, correct 3:4
    # composition, 179s including the model load. Equal to the final size
    # below, so nothing is given up; the widest shape (1344x768) probed
    # clean at seed 1111, 4 steps (research/aspect/krea2-turbo).
    aspect_size: 1024
    dt_filename: "krea_2_turbo_i8x.ckpt"   # official DT build, 8-bit S
    # Krea 2 Turbo, civitai.com/models/2732656 (Civitai official), version
    # v1.0. Searching "Krea 2 Turbo" does not surface it -- community
    # re-uploads rank above it.
    civitai_version_id: 3072332
    # 12B DiT, distilled: official settings are 8 steps at CFG 1.
    # Qwen3-VL text encoder: natural language prose, no negative prompts.
    #
    # Euler A Trailing, Draw Things' own recommendation for this checkpoint
    # (sampler 10 in its catalogue). Without an explicit sampler this model
    # renders rainbow speckle with no subject whenever Draw Things' UI is left
    # on an SDXL sampler such as DPM++ 2M Karras, at any size
    # (docs/decisions/MODEL-MEASUREMENTS.md).
    sampler: "Euler A Trailing"
    cfg: 1.0
    uses_negative_prompt: false
    prompt_style: prose
    prompt_guidance: |
      Write natural, descriptive prose of 30-90 words, as if explaining the
      image to a person: subject and appearance, action, environment,
      lighting, camera and composition, style and mood. Full sentences work
      well; front-load the subject. Never use negative phrasing: state the
      desired quality positively. No tag lists, no weighting syntax.
    # Measured: marker present at every length tested but visibly smaller from
    # 592 characters on, and the subject is small by 860.
    prompt_budget: { full: 350, fading: 700 }
    # 768, the floor for every draft's long side (tests/test_registry.py),
    # 57s a draft. The Faithful over a 512 draft is crisp too -- iris,
    # freckles, watch numerals at 1:1 (research/draft-size/krea2-turbo) --
    # so the size here is about the shapes, not sharpness: a 512 budget puts
    # 16:9 at 704x384, a 2.7x jump to the 1344x768 final.
    draft: { size: 768, steps: 8 }
    # 12 steps, half again what Draw Things recommends ("Use 8 sampling steps
    # with CFG 1"). Swept on whole frames (docs/decisions/FINAL-STEPS.md;
    # cells in research/final-steps/krea2-turbo, and one row committed under
    # research/demo/): 4 is soft, 8 still carries visible noise when you zoom
    # in, 12 is where the noise clears, and 16 is sharper again. 12 fixes the
    # defect; 16's extra detail is not worth a further 30% of the render.
    # A distilled model's published step count is a speed setting, not a
    # quality one. Do not "correct" this to the catalogue value.
    #
    # 140s at 1024 (8 steps: 94s, 16 steps: 182s). cfg stays 1.
    final: { size: 1024, steps: 12, strength: 0.5 }
    # Same untiled ceiling as the Cosmos 2B models, at the same 1536, despite
    # sharing none of their architecture -- so this is Draw Things' denoiser
    # rather than any model's competence. tiled_diffusion clears it: 2048 at
    # 0.996 correlation with the source.
    upscale: { size: 2048, steps: 6, strength: 0.3 }
    tiled_diffusion: true
    upscale_seconds: 270

  bas-anima:
    label: "BAS+ Anima"
    # Below the 1536 final: 16:9 at that budget (2048x1152, seed 1111, 4
    # steps, research/aspect/bas-anima) draws two girls, one grid step down
    # (1984x1088) draws one. Same line as z-image-turbo, found the same way
    # (docs/decisions/SHAPES.md).
    aspect_size: 1472
    dt_filename: "basbetteranimestyleplusanima_basev10_f16.ckpt"
    # BAS+ Better Anime Style Plus (Anima base v1.0).
    # Only used when publishing an image made with it: it is what
    # attributes the checkpoint on the Civitai post, since a converted
    # .ckpt cannot be matched by hash. Update it with the weights.
    civitai_version_id: 3004325
    # Draw Things' converted file, found under any name (ModelSpec.fingerprints)
    fingerprints: ["8118469a243134878ed9584af1ae96e44ef7d1e3b92b29d8eb93140b3588902d"]
    # its guidance below calls these trigger tags required, so they lead every
    # prompt, enriched or hand-written
    quality_prefix: "anime, anime_coloring, anime_screenshot, masterpiece, best quality"
    # BAS+ (Better Anime Style Plus), Anima/Cosmos 2B base with the Anima
    # Turbo LoRA baked in: card says ER SDE/Euler, 8 steps, CFG 1 (important).
    # At CFG 1 negative prompts have no effect. Trigger words required.
    # DT lacks ER SDE/plain Euler; Euler A Trailing verified working.
    sampler: "Euler A Trailing"
    cfg: 1.0
    uses_negative_prompt: false
    prompt_style: tags
    prompt_guidance: |
      Start every prompt with exactly "anime, anime_coloring, anime_screenshot,
      masterpiece, best quality" (these trigger tags are required), then
      describe the picture in prose -- ordinary sentences, about 60-90 words --
      using Danbooru's exact wording wherever it has a word for what you mean
      (1girl, twin braids, from above, looking at viewer) and plain English
      wherever it does not. Cover subject count first, then character and
      series when the subject is a known character, appearance, clothing,
      expression and pose, scene, lighting, composition, style. Say which
      subject has which feature and where each thing is in sentences.
    # Measured, and the tightest of anything shipped: the subject falls from 57%
    # of frame height at 109 characters to 22% at 393 and 10% at 860, and the
    # end-of-prompt marker is gone entirely by 860. Its Turbo LoRA runs at CFG
    # 1, where there is no guidance to hold a long prompt together.
    prompt_budget: { full: 240, fading: 450 }
    # 768 at 8 steps, 13s. Measured at 1024/768/640/512 on two scenes and two
    # seeds: this model composes cleanly at every one of them -- single
    # subject, correct anatomy, readable stalls -- and the Faithful from a 768
    # draft matches the one from a 1024 draft, faces indistinguishable
    # (docs/decisions/DRAFT-STEPS.md). 640 is clean too, at 8.5s; 768 is the
    # size every other model drafts at.
    #
    # Steps stay at 8: the checkpoint has the Anima Turbo LoRA baked in and
    # runs at CFG 1, and a distilled few-step recipe is the fragile thing on
    # a model like this (DPM++ 2M Karras renders pure noise here;
    # docs/decisions/MODEL-MEASUREMENTS.md). Laplacian variance cannot be
    # compared across sizes; judge a size change on a 1:1 crop.
    draft: { size: 768, steps: 8 }
    # 24 steps, the knee rather than the top of the ladder: on whole frames,
    # two crowded scenes and two seeds (8 / 16 / 24 / 32), 8 is bad, 16
    # acceptable, 32 better (docs/decisions/FINAL-STEPS.md). About 190s at
    # 1536. The draft stage (768/8) and the upscale stage (2048/8) are
    # measured separately -- do not scale them to match.
    final: { size: 1536, steps: 24, strength: 0.5 }
    # Same untiled 1536 ceiling as the other Cosmos 2B models; cleared by
    # tiled_diffusion, which gets 2048 at 0.996 correlation with the source.
    # Cheapest model here to upscale, at 8 steps.
    upscale: { size: 2048, steps: 8, strength: 0.3 }
    tiled_diffusion: true
    upscale_seconds: 38

  cyberrealistic-anima:
    label: "CyberRealistic Anima"
    # Equal to the final size below, which already keeps 16:9 to a 1856 long
    # edge (1856x1088): probed there at seed 1111, 6 steps, one figure
    # (research/aspect/cyberrealistic-anima). 2048 is where the other two
    # Anima checkpoints and z-image-turbo double (docs/decisions/SHAPES.md).
    aspect_size: 1408
    dt_filename: "cyberrealisticanima_v60aestheticv11_f16.ckpt"
    # CyberRealistic Anima v6.0.
    # Only used when publishing an image made with it: it is what
    # attributes the checkpoint on the Civitai post, since a converted
    # .ckpt cannot be matched by hash. Update it with the weights.
    civitai_version_id: 3136380
    # Draw Things' converted file, found under any name (ModelSpec.fingerprints)
    fingerprints: ["3701a3c10f08b3ad02683f1d8bd973c8f273725560d23bd409d0b737fd99032f"]
    # score tags are this model's own dial, per its guidance below
    quality_prefix: "masterpiece, best quality, highres, score_7, score_8, realistic"
    # as its guidance below requires, for generations that arrive without one
    negative_prefix: "worst quality, low quality, sketch, score_1, score_2, score_3, censored"
    # Anima/Cosmos 2B, standard CFG (not turbo). Card: er_sde/euler ancestral,
    # 40-60 steps (28 acceptable), cfg 4-5.5, optimal resolution under ~2MP.
    sampler: "Euler a"
    cfg: 5.5
    uses_negative_prompt: true
    prompt_style: tags
    prompt_guidance: |
      Start every prompt with exactly "masterpiece, best quality, highres,
      score_7, score_8, realistic", then describe the picture in prose --
      ordinary sentences, about 60-90 words -- using Danbooru's exact wording
      wherever it has a word for what you mean, written WITHOUT underscores
      ("blue eyes", not "blue_eyes"), and plain English wherever it does not.
      Write sentences throughout -- do not put a list of bare tags between the
      opener and the description; every attribute belongs in a sentence that
      says whose it is. Cover subject count first, then character/series,
      appearance, clothing, expression and pose, scene, lighting, composition. Say which subject has
      which feature and where each thing is in sentences: measured here, prose
      scored 95% against 85% for the same content as a tag list, and it was
      the only form that put one object on top of another. Score tags 6-9 dial
      polish up or down.
      Every negative_prompt must start with "worst quality, low quality,
      sketch, score_1, score_2, score_3, censored" and may append
      scene-specific tags to avoid.
    # Measured by eye only: marker clear to 393 characters, small but present
    # at 860 -- the gentlest decay of the three Cosmos models. `full` follows
    # the family: the two Cosmos subject-size curves that were scored both
    # collapse right after 236, and nothing suggests this one differs. If it
    # matters, score this model's curve rather than inheriting the family's.
    prompt_budget: { full: 240, fading: 700 }
    # 20 steps, and do NOT lower them: this model darkens as steps come off.
    # Composition is identical at 20, 14 and 10, so the draft looks fine as a
    # preview, but brightness drops monotonically (portrait 148/130 at 20,
    # 113/88 at 14, 72/67 at 10), and a draft is the init for Faithful at
    # strength 0.5, which preserves exposure. Faithful brightness, same seeds:
    #
    #     from 20-step draft   145 / 126     (the reference)
    #     from 14-step draft   109 /  84     -25% / -33%
    #     from 10-step draft    68 /  63     -53% / -50%
    #
    # Euler a under-converging on this checkpoint, not a property of thin
    # drafts in general -- the SDXL models do not drift
    # (docs/decisions/DRAFT-STEPS.md).
    #
    # 768, the floor for every draft's long side (tests/test_registry.py).
    # Shrinking the frame does not darken it the way cutting steps does.
    draft: { size: 768, steps: 20, cfg: 5.0 }
    # 30 steps: swept at 30 / 44 / 60, two scenes
    # (docs/decisions/FINAL-STEPS.md; frames in research/final-steps/). 30 is
    # somewhat softer than 44 or 60 and no less realistic for being softer.
    # 44 is the alternative for a sharper frame (610s against 395s); 60 is not
    # worth it. At 30 the Faithful asks 60 steps, inside its cap of 64.
    #
    # A STRUCTURE is visible on every picture this model makes, at every rung,
    # and more steps make it MORE visible. qwen-image shows what looks like the
    # same pattern, and every model it has been seen on runs the Qwen VAE --
    # see the shared-autoencoder note in docs/decisions/FINAL-STEPS.md. If that
    # holds it is neither this checkpoint nor its schedule.
    final: { size: 1408, steps: 30, strength: 0.5 }   # ~2MP optimum ceiling
    # The Anima Turbo LoRA, as on lustrousmix-anima. Final at 8 steps and CFG
    # 1 against 30 at CFG 5.5, both final-steps scenes, seed 1111
    # (research/final-steps/cyberrealistic-anima/SHEET__turbo_compare.png):
    # ~55s against ~395s, and it stays itself -- realistic faces, clean lace,
    # watch, apron and chopsticks. Darker and less saturated: red hair came
    # back brown, the neon duller. Drafts at 1024 for the reason given on
    # lustrousmix-anima: the Faithful over a 640 turbo draft comes back soft.
    lora_options:
      - key: turbo
        label: "Anima Turbo (8 steps)"
        file: "anima_turbo_lora_v0.2_lora_f16.ckpt"
        negative_prompt: false
        civitai_version_id: 2979642     # Anima Turbo LoRA v0.2
        stages:
          draft: { size: 1024, steps: 8, cfg: 1.0 }
          final: { steps: 8, cfg: 1.0 }
    # Same untiled 1536 ceiling as the other Cosmos 2B models; cleared by
    # tiled_diffusion, which gets 2048 at 0.996 correlation with the source.
    upscale: { size: 2048, steps: 24, strength: 0.3 }
    tiled_diffusion: true
    upscale_seconds: 213

  juggernaut-ragnarok:
    label: "Juggernaut XL Ragnarok"
    # Equal to the final size below, so nothing is given up. Measured directly
    # at 1344x768: single lighthouse, one horizon, exact size, 101s; and the
    # standard scene there at seed 1111, 5 steps, one figure
    # (research/aspect/juggernaut-ragnarok).
    aspect_size: 1024
    dt_filename: "juggernaut_xl_ragnarok_f16.ckpt"
    # Juggernaut XL Ragnarok, by KandooAI.
    # Matched by filename: this version ships juggernautXL_ragnarok.safetensors.
    # Only used when publishing, to attribute the checkpoint on the post;
    # a converted .ckpt cannot be matched by hash. Update it with the weights.
    civitai_version_id: 1759168
    # creator-recommended: DPM++ 2M Karras, cfg 4-6, 30+ steps
    sampler: "DPM++ 2M Karras"
    cfg: 5.0
    uses_negative_prompt: true
    prompt_style: prose
    # Ordering advice only; length comes from prompt_budget below.
    prompt_guidance: |
      Subject and appearance first, then setting, then lighting, then
      photographic language (camera body, lens and aperture, film stock,
      e.g. "85mm f/1.8, Portra 400"). Comma-separated keyword phrases are
      preferred over full sentences.
    # Measured, and the roomiest here. Its dual CLIP encoder has the SHORTEST
    # context of anything shipped, yet the marker rendered at full size at
    # every length up to 860 characters: Draw Things chunks a long prompt into
    # 75-token windows and encodes all of them, so the tail is not dropped.
    # `fading` is where the measurement stopped, not a cliff anybody found.
    prompt_budget: { full: 600, fading: 900 }
    # The bare checkpoint at 14 steps -- the rung three of the four SDXL
    # checkpoints in DRAFT-STEPS.md settled on, and 14 and 20 are the same
    # picture here too (frames in research/draft-size/juggernaut-ragnarok,
    # seed 1111, both scenes; Faithful brightness 64.1 / 64.1 and 87.9 / 87.1).
    # 18.5s a draft against 25s at 20.
    #
    # No DMD2 LoRA on the draft: a Faithful is img2img at 0.5 over the draft,
    # and DMD2's high-contrast ink-outline poster look rides straight through
    # it, where a plain draft gives the photograph the checkpoint draws on its
    # own. It saves nothing either (20.3s against 18.5s). docs/decisions/
    # FINAL-STEPS.md and DRAFT-STEPS.md.
    draft: { size: 768, steps: 14 }
    # 32 steps: swept at 20 / 32 / 48, two scenes
    # (docs/decisions/FINAL-STEPS.md; frames in research/final-steps/). Some
    # anatomic detail is wrong at 48 exactly as at 20 -- the checkpoint's own
    # limitation, which no step count buys back -- while minor detail
    # elsewhere in the frame is better at 32 than at 20. 48 adds nothing
    # visible over 32.
    final: { size: 1024, steps: 32, strength: 0.5 }
    # 2048 measured clean and quick (82s, corr 0.99 against the source): SDXL
    # has none of the 2.4MP trouble the Cosmos and Krea models hit, so this
    # needs no diffusion tiling. That also caps it at 2048: 3K and 4K are
    # offered only where tiled_diffusion is on, and enabling it here is
    # untested (see the note below).
    upscale: { size: 2048, steps: 24, strength: 0.35 }
    # deliberately not tiled_diffusion: it renders 2048 unaided, and the one
    # run that combined the two took Draw Things down (on a session that was
    # already short of RAM, so the flag is not proven guilty -- but there is
    # nothing to gain by finding out)
    upscale_seconds: 84

  qwen-image:
    label: "Qwen Image 2512"
    dt_filename: "qwen_image_2512_i8x.ckpt"
    # Qwen-Image-2512, civitai.com/models/2268063 (Civitai official),
    # version "bf16" -- the unquantised weights this build converts.
    civitai_version_id: 2552957
    # The text-to-image half of the family whose editor ships here as
    # qwen-edit: a 20B MMDiT with a Qwen2.5-VL-7B text encoder, and the same
    # ~20GB on disk. Draw Things recommends UniPC Trailing, 30 steps, CFG 4.
    # It renders beautifully and it is by far the most expensive thing here
    # that is not a video model -- see the step ceiling below before changing
    # any number in this entry.
    sampler: "UniPC Trailing"
    cfg: 4.0
    # CFG 4 is real classifier-free guidance, so unlike qwen-edit (CFG 1) a
    # negative prompt does something here. NOT measured -- no render has been
    # spent comparing one against none on this model; it is on because that is
    # what every other CFG>1 model here does.
    uses_negative_prompt: true
    prompt_style: prose
    prompt_guidance: |
      Write natural, descriptive prose of 30-90 words: subject and appearance,
      action, environment, lighting, camera and composition, style and mood.
      Full sentences work well; front-load the subject. Never use negative
      phrasing: state the desired quality positively. No tag lists, no
      weighting syntax.
    # Measured (docs/decisions/PROMPT-LENGTH.md), ten renders at this entry's
    # own 1024/12, two seeds, scored by colour mask. The roomiest model here
    # after Juggernaut: the subject still holds 34-37% of frame height at 410
    # characters, the same as it does at 269, and only falls to ~20% by 622 --
    # so the collapse is between 410 and 622 and `full` sits below it. At 821
    # characters the whole prompt is still being acted on: bandstand,
    # signpost, litter bin, pigeons and chain fence all render, and the
    # balloon marker is small but unmistakable. `fading` is where the ladder
    # stopped rather than a cliff anybody found.
    prompt_budget: { full: 400, fading: 800 }
    # 864, below the 1024 final, because of the step ceiling below. At a 1024
    # budget 3:4 and 4:3 (896x1152, 1152x896) render correctly against square
    # controls at the same prompt and seeds -- but 16:9 is 1344x768, over the
    # ceiling, and came back empty at one seed of two. 864 is the largest
    # budget whose widest shape keeps a 1152 long edge (16:9 is 1152x640, 3:2
    # 1088x704, 4:3 1024x768), and 1152x12 is a row that rendered three times
    # out of three. Measured at 864 on every ratio (seed 1111) and on 16:9 and
    # 9:16 at 2222: 8 of 8 returned an image, one figure each, 144-156s
    # (research/aspect/). With the turbo recipe (research/aspect/qwen-image/
    # *__turbo.png, seeds 1111 and 2222): 14 of 14 returned, 13 with one
    # figure; 4:3 at 1111 drew two women. Square keeps 1024; the 768 draft is
    # under the budget. Raising final.steps from the gear lowers the ceiling
    # for shapes first.
    aspect_size: 864
    # ...and it is a ceiling, not a composition budget: the frames above it
    # come back EMPTY, so a Faithful keeps to it as well, where the SDXL
    # entries' Faithfuls do not (app/schemas.py, ModelSpec.shaped_cap). The
    # app only tiles at 2048 and up, so tiled_diffusion below does not lift it.
    aspect_size_is_ceiling: true
    #
    # THE STEP CEILING. Above a certain amount of work per request Draw Things
    # runs the render to completion and then answers 200 with an empty
    # `images` list -- the same response a stalled session gives. It is not a
    # stalled session: every cell below was bracketed by a 256px control
    # render on another model, and all of those came back in 3-20s. Sizes are
    # long edge x steps.
    #
    #   1024 x 12   209s, 203s + 12 more   image   <- what this entry ships
    #   1152 x 12   241s, 270s, 279s       image   (the 3:4 and 4:3 shapes)
    #   1344 x 12   195s EMPTY / 255s image        <- flaky, both seeds shown
    #   1024 x 16   280s, 278s EMPTY; 273s, 278s image on a re-check
    #   1024 x 20   323s                   EMPTY
    #   1024 x 30   479s                   EMPTY   <- DT's own recommendation
    #    768 x 12   128s                   image   <- what the draft ships
    #    768 x 20   175s, 205s             EMPTY
    #    512 x 20   110s                   image
    #
    # It is not a timeout: 768x20 failed at 175s while 1024x12 succeeded at
    # 209s. It is not pixel count: 896x1152 and 1344x768 are the same area at
    # the same step count and behave differently. What fits most rows is
    # roughly long-edge x steps, with everything at or under ~13800 returning
    # an image and everything at or above ~15300 usually not -- but 1344x12
    # (16128) and 1024x16 (16384) each went both ways, so past the threshold
    # this is unreliable rather than dead, and the threshold is a line fitted
    # to the rows, not a mechanism. Rely on the rows, and re-run any single
    # failure at another seed before treating it as a rule.
    #
    # Operationally: Draw Things' recommended 30 steps DOES NOT WORK here, 12
    # works at every size tried, and any number raised in this entry has to be
    # re-measured rather than assumed.
    draft: { size: 768, steps: 12 }
    # 12 steps, a stop rather than a ceiling: checked at 8 / 12 / 16 on two
    # crowded scenes (docs/decisions/FINAL-STEPS.md; frames in
    # research/final-steps/), good at 12, better at 16 -- the only model in the
    # sweep to render the cat's face undistorted -- at 211s against 275s.
    # Raise it if a frame is worth the extra minute.
    #
    # It also shows the same persistent noise pattern as some other models here,
    # present at every rung. See the shared-autoencoder note in
    # docs/decisions/FINAL-STEPS.md: every model it has been seen on runs the
    # Qwen VAE, which would make it neither a step count nor a checkpoint.
    final: { size: 1024, steps: 12, strength: 0.5 }
    upscale: { size: 2048, steps: 8, strength: 0.3 }
    # 2048 comes back clean at 0.991 correlation with its source, faster than
    # the 1024 final that fed it. A tiled 2048 pass is far more total work
    # than the 1024x16 render that can return nothing, and the difference
    # between them is that tiling bounds the memory. Its sibling qwen-edit
    # needs this flag at 2048 for the same reason, and is the same size class.
    tiled_diffusion: true
    upscale_seconds: 442
    # 4096 returns an empty response after 511s, so the 3K/4K that
    # tiled_diffusion would otherwise offer are capped. 3072 is untested; the
    # cap is the last size measured good (docs/decisions/UPSCALING.md).
    max_upscale_size: 2048
    # Wuli-art's Qwen-Image-2512 Turbo LoRA (Civitai 2267786, version
    # 2552570), imported by hand. Not the lightx2v Lightning LoRA in Draw
    # Things' own list: that one never finishes a render on this i8x build
    # once weight x prompt length x frame size adds up -- a real prompt at
    # 1024 fails even at weight 0.3 (research/qwen-lightning/results.json).
    # This one renders every cell at weight 1.0.
    #
    # Measured against 12 steps at CFG 4, both final-steps scenes, seed 1111
    # (research/qwen-turbo/, SHEET__compare.png): the same photographic look,
    # and MORE of the prompt on the frame -- freckles, the lace weave, the
    # loupe, the cash tin and the cat -- at 4 steps in ~50s against 211s. Not
    # for free: skin comes out harsher, heavier freckles and harder contrast
    # where the plain pass is soft and natural (the distilled look), and at 4
    # steps small things -- the fish, the coins -- are a touch softer, with the
    # ground behind them blurrier. 8 steps brings the fish back for 85s at
    # 1024, so 4 is the default and the gear's step box is the dial for a
    # picture worth 8. A 768 draft at 4 steps takes 35s and its Faithful lands
    # on it. CFG 1, so no negative prompt.
    #
    # The final stays at 1024. 1536 x 4 is far under the step ceiling and the
    # two probe scenes rendered at 1536 in ~105s, sharper at 1:1 than 1024 --
    # but the aspect sweep's sunflower prompt at 1536 comes back EMPTY every
    # time, at weight 1.0 and 0.6, while 0.8 renders it. That is the lightx2v
    # Lightning failure again, further out and not monotonic in anything, so
    # 1536 is a coin flip per prompt and an empty reply is what the app reads
    # as a stalled renderer. 1024 and the 864 shape budget: 14 of 14 shapes,
    # every probe cell, no empties.
    #
    # The upscale follows the tick too, so the tick means "this model runs
    # with the LoRA", and it hardens the skin the same way the finals do:
    # untick it for a portrait worth the softer pass. 4 steps there (196s,
    # 0.970 correlation with the enlarged init) against 442s for the plain
    # pass; 4 is a better frame at 1:1 than 8 (docs/decisions/
    # MODEL-MEASUREMENTS.md). upscale_seconds above is the plain pass's.
    lora_options:
      - key: turbo
        label: "Turbo (4 steps)"
        file: "wuli_qwen_image_2512_turbo_lora_4steps_v1.0_bf16_comfyui_lora_f16.ckpt"
        negative_prompt: false
        civitai_version_id: 2552570
        stages:
          draft: { steps: 4, cfg: 1.0 }
          final: { steps: 4, cfg: 1.0 }
          upscale: { steps: 4, cfg: 1.0 }

  qwen-edit:
    label: "Qwen Edit 2511 (instruct)"
    dt_filename: "qwen_image_edit_2511_i8x.ckpt"
    # Qwen-Image-2512, civitai.com/models/2268063 (Civitai official),
    # version "Image Edit 2511": the editor ships as a version of that
    # page rather than one of its own.
    civitai_version_id: 2558804
    sampler: "Euler A Trailing"
    cfg: 1.0
    uses_negative_prompt: false
    prompt_style: prose
    # instruction editor: takes the image plus plain words ("change the dress
    # to red") and rewrites only what the instruction touches. Not a generator;
    # no chip, only the Instruct action on image cards.
    edit_only: true
    # The largest model here at ~20GB. With only tiled_decoding, 2048 returns
    # a flat colour field after ~5 minutes and reports success, and with no
    # tiling at all it eats the machine's RAM until Draw Things has to be
    # killed by hand. tiled_diffusion fixes both: 2048 comes back at 1.000
    # correlation with the source and memory stays bounded. It is slow
    # (~12 min) because of the model's size, not because of the tiling.
    tiled_diffusion: true
    upscale_seconds: 721
    # Without the LoRA option below, step count matters more than it looks --
    # scale it to how much has to be painted from nothing: 8 for colour
    # changes only, 16 to remove or replace something, 24+ to add a new
    # highly detailed object. Under-stepping comes out washed out and soft.
    # Every instruction edit goes through this stage -- Instruct, a rectangle
    # addition, Combine -- and all three dialogs seed their steps from it.
    # NOT MEASURED, and the probe would not describe it: this is an instruction
    # editor, so its prompt is a short edit instruction against an existing
    # image ("make the sky overcast"), not a scene description. Its prompts sit
    # far inside any budget. Left at the default.
    prompt_budget: { full: 240, fading: 600 }
    draft: { size: 768, steps: 8 }
    final: { size: 1024, steps: 16, strength: 1.0 }
    # Ticked by default: 4 steps instead of 16. Measured on one scene, same
    # seed, against 16 steps without it (research/lightning-edit/,
    # docs/decisions/EDITING.md decision 16): ~95s against ~320s, and the
    # rest of the frame held as well or better every time. A colour change
    # came back the same picture; a rectangle addition and Combine came back
    # better. A whole-image addition came back crisper but on a flat dark
    # contact shadow. A replacement did not work: with the LoRA, at 4 and 8
    # steps alike, the barrel was set down in front of the plant, leaves still
    # showing; without it the barrel took the pot's place. That is what the
    # tick is for. More steps on the LoRA are not the fix -- 8 came back the
    # same picture as 4 in twice the time.
    lora_options:
      - key: lightning
        label: "Lightning (4 steps)"
        file: "qwen_image_edit_2511_lightning_4_step_v1.0_lora_f16.ckpt"
        stages: { final: { steps: 4 } }
    upscale: { size: 2048, steps: 8, strength: 0.3 }

# To add a model:
#   1. Download it in Draw Things. The exact quantisation doesn't matter: the
#      server matches any variant of that filename (q8p, i8x, f16...) in
#      models_dirs, and hides the chip when none is installed.
#   2. Run the harness. It does the measuring, and prints an entry:
#        uv run python scripts/add_model.py --model <file> --key <key>
#      Add --tags for a Danbooru/booru checkpoint, --level quick to halve the
#      render count on a slow model.
#   3. Look at the images it names -- duplicated subjects in the size grid,
#      whether the draft looks like its final, whether the portrait and wide
#      cells composed correctly against their square controls -- and fill the
#      TODOs it left. It cannot judge those, and it does not pretend to.
#   4. Write prompt_guidance yourself, from the model's card. That is the
#      model's dialect, not a measurement.
# Everything else has a workable default -- see ModelSpec in app/schemas.py
# for the full field list, and docs/ADDING-A-MODEL.md for the steps; the
# harness measures what it measures and reasons about the rest.
#
# The one thing worth knowing before you start: Draw Things already caches its
# own recommended sampler, steps and cfg for every model it ships, and the
# harness reads them. Don't probe for settings the app already knows.

# Image-to-video models for the Animate action. Separate from `models` above
# because none of the draft/final/upscale staging applies: a video job is one
# shot at one size, and the only two useful dials are clip length and model.
#
# Settings below are measured, not guessed (see the numbers per entry).
# Draw Things floors each side of a video request to a multiple of 64, so
# 832x480 comes back 832x448; never assume output dimensions match the
# request. The width/height below are a pixel budget rather than a fixed
# shape: each clip is requested in its own still's aspect at roughly this
# area (clip_size in app/video.py), so a square image is not squashed.
#
# To add one: label, dt_filename and a width/height pixel budget are enough to
# start; steps/cfg/motion_scale default sensibly (VideoModelSpec in
# app/schemas.py). Measure sec_per_frame the same way FusionX's was: time a
# real clip and divide. Read docs/decisions/VIDEO.md before adding an
# anime-tuned I2V model or a Wan 2.2 A14B pair.
#
# MiniMax H3 and FusionX ship, H3 first: the Animate dialog offers the first
# as its default, and H3 is the recommendation -- twice as fast with its Turbo
# LoRA, and the only one that has done a pose change (docs/decisions/VIDEO.md).
video_models:
  minimax-h3:
    label: "MiniMax H3 + Turbo"
    # The FL2VA checkpoint: the still is the first frame. Not the [ref2va]
    # one, which takes the still as a character reference and composes a new
    # shot around it, so the clip need never show the picture that was
    # animated. 4-bit S because the 8-bit S file alone is 34GB on a 48GB Mac.
    dt_filename: "minimax_h3_fl2va_i4x.ckpt"
    # Base H3 wants ~50 steps (Draw Things' own recommendation); the Turbo
    # LoRA (larryvrh, v4 step 600 EMA) is what makes 4-8 usable, and its card
    # says 6-8 look best and past 8 over-sharpens, at strength 1.0. Not in
    # Draw Things' catalogue: imported by hand from
    # huggingface.co/inflected111/MiniMax-H3-Turbo-Lora. Missing, the chip is
    # hidden: measured on 22 frames, 8 steps without it leaves a cross-hatched
    # grid texture on the moving hair (155s), and Draw Things' own 50 steps
    # without it is clean but took 606s against the LoRA's 172.
    loras:
      - file: "minimax_h3_turbo_v4_step600_ema_lora_f16.ckpt"
        weight: 1.0
    steps: 8
    cfg: 1.0
    # Draw Things' recommended H3 configuration: sampler 16 (DDIM Trailing),
    # shift 12, audio shift 3, 832x512, 24 fps.
    sampler: "DDIM Trailing"
    shift: 12.0
    shift_for_audio: 3.0
    width: 832
    height: 512
    frame_step: 17
    frame_offset: 5
    fps: 24
    # 22/56/73/124/141/192 frames. 8 s (192) is the longest H3's grid allows
    # under Draw Things' 201-frame ceiling (video.MAX_FRAMES; 243 frames is
    # refused with a 422). 6 and 8 s are not rendered here: the cost below is
    # near-linear, so 8 s is about 22 minutes.
    clip_seconds: [1, 2, 3, 5, 6, 8]
    # 640x640 on an M4 Pro (48GB) with the Turbo LoRA at 8 steps: 172s for
    # 22 frames (with the first model load) and 860s for 124, i.e. close to
    # linear rather than Wan's frames^1.32. Swap peaked at 20GB during the
    # text encode and nothing was evicted. The response is frames only: the
    # soundtrack H3 renders does not come back over the HTTP API.
    sec_per_frame: 6.9
    sec_per_frame_at: 124
    cost_exponent: 0.0
  fusionx:
    label: "Wan 2.1 14B I2V FusionX"
    dt_filename: "wan_2.1_14b_i2v_fusionx_q8p.ckpt"
    # Accelerator LoRAs are baked in, so 8 steps at CFG 1 is correct and more
    # steps only cost time. Held detail perfectly at both 33 and 81 frames
    # (sharpness retention 1.07 and 1.25, i.e. no decay at all).
    steps: 8
    cfg: 1.0
    width: 832
    height: 480
    # measured 17.1 s/frame at 33 frames and 22.8 at 81: cost grows as roughly
    # frames^1.32, so the estimate uses the longer-clip figure
    sec_per_frame: 22.8
