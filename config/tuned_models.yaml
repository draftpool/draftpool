# Settings measured on specific checkpoints, by Civitai version id.
#
# The app recognises an import of one of these versions on the start after it
# is imported (app/migrate.py) and sets it up with these settings instead of
# its class's profile (config/base_models.yaml); scripts/add_civitai_model.py
# does the same when asked. The sampler, steps, sizes and the rest were
# rendered and judged on that exact file. Generated from the measured
# entries; not edited by hand.
#
#   key, label           the app's key and name for it; only on a model that is
#                        not adult-flagged on Civitai, the rest are not named
#   draw_things_version  the architecture Draw Things records for the import;
#                        a mismatch is refused
#   fingerprints         its weights in Draw Things' converted file, so the app
#                        recognises the import whatever it is called
#   files                hashes of the file names it is downloaded under, for
#                        an import the fingerprint misses (a quantised one)
#   settings             a `models:` entry minus label, dt_filename and
#                        civitai_version_id

