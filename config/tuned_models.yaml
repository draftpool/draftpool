# Settings measured on specific checkpoints, by Civitai version id.
#
# scripts/add_civitai_model.py uses an entry here instead of the base model's
# profile (config/base_models.yaml) when the checkpoint you add is one of
# these versions: the sampler, steps, sizes and the rest were rendered and
# judged on that exact file. Generated from the measured entries; not edited
# by hand.
#
#   draw_things_version  the architecture Draw Things records for the import;
#                        a mismatch is refused
#   settings             a `models:` entry minus label, dt_filename and
#                        civitai_version_id

