site_name: draftpool
# Pages serves the site under /draftpool/; without this the 404 page's styles
# and the sitemap point at the wrong place
site_url: https://draftpool.github.io/draftpool/
repo_url: https://github.com/draftpool/draftpool
repo_name: draftpool/draftpool
# the home page's search-result description; the other pages' are in
# scripts/docs_site.py
site_description: Self-hosted image generation for Apple Silicon Macs. Draw Things renders cheap drafts, a local LLM writes the prompts, and only the keepers get finished.

# The site is the user docs as they are in the repo; scripts/docs_site.py
# makes README.md the home page and unlinks what is not published here.
docs_dir: docs
exclude_docs: |
  decisions/
  LORA-RECOMMENDATIONS.md
hooks:
  - scripts/docs_site.py

nav:
  - Home: index.md
  - Setup: SETUP.md
  - Guide: GUIDE.md
  - Deep dive: DEEP-DIVE.md
  - Adding a model: ADDING-A-MODEL.md
  - Credits: CREDITS.md

theme:
  name: material
  # link-preview (Open Graph) tags
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      # GitHub's anchors, so links that work on GitHub work here too
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.highlight
  - pymdownx.superfences

validation:
  links:
    anchors: warn
